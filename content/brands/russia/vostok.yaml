    - Осенью 1941 года Второй Московский часовой завод был эвакуирован в Чистополь на Каме для выпуска танковых и авиационных приборов.
    - В 1967 году конструкторы Михаил Новиков и Вера Белова разработали «Амфибию» по заказу ВМФ СССР.
    - "Часы выдерживали глубину 200 метров благодаря гениальной геометрии: давление воды прижимает купольное стекло и заднюю крышку к широкой резиновой прокладке, увеличивая герметичность."
