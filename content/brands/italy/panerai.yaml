    story:
      - "Panerai с 1930-х годов делала приборы и часы для итальянских боевых пловцов. Название Luminor дано по светящемуся составу на основе трития, который марка запатентовала в 1949 году."
      - "Фирменный мост с рычагом прижимает заводную головку к корпусу и делает его герметичным. В свободную продажу часы Panerai поступили только в 1993 году, а в 1997-м марку купила группа Vendôme, нынешняя Richemont."
    icon: true
    highlights: [Защитная скоба Safety Lock, 300 метров водозащиты, Малая секундная стрелка на 9 часах, 72 часа запаса хода]
