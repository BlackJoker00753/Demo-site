brand:
  slug: panerai
  name: Panerai
  aliases: [панерай, panerai]
  country: italy
  founded: 1860
  founder: Джованни Панерай
  city: Флоренция
  lat: 43.7696
  lon: 11.2558
  independent: false
  tier: luxury
  manufacture: full
  manufacture_note: Историческая колыбель марки находится во Флоренции, а мануфактура механизмов расположена в Невшателе в Швейцарии.
  website: https://www.panerai.com
  sort: 1
  tagline: Флорентийские приборы для боевых пловцов итальянского королевского флота.
  story:
    - Джованни Панерай открыл мастерскую на мосту Понте-алле-Грацие во Флоренции в 1860 году. Долгое время марка поставляла измерительные приборы для военно-морского флота Италии.
    - В 1936 году по секретному заказу флота были созданы часы Radiomir для боевых пловцов-диверсантов. Патент на светящийся состав обеспечил видимость в мутной воде.
    - В 1950 году была запатентована знаменитая полукруглая скоба с прижимным рычагом. Так родился облик модели Luminor, узнаваемый с первого взгляда.
  facts:
    - {label: "Основан", value: "1860 год во Флоренции"}
    - {label: "Защитная скоба", value: "Патент 1950 года"}
    - {label: "История", value: "Часы боевых пловцов Италии"}
  milestones:
    - {year: 1860, text: "Открытие мастерской во Флоренции"}
    - {year: 1936, text: "Создание прототипа Radiomir для военных водолазов"}
    - {year: 1950, text: "Патент на защитную скобу заводной головки Luminor"}
    - {year: 1997, text: "Выход марки на гражданский международный рынок"}

