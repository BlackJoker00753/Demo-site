brand:
  slug: seiko
  name: Seiko
  aliases: [сейко, сэйко]
  country: japan
  founded: 1881
  founder: Кинтаро Хаттори
  city: Токио (Гиндза)
  lat: 35.6717
  lon: 139.7650
  group: Seiko Group
  tier: accessible
  manufacture: full
  manufacture_note: Вертикальная интеграция. Seiko сама выращивает кварц, делает спирали, камни, масла и даже сплавы для пружин.
  website: https://www.seikowatches.com
  sort: 1
  tagline: Изобретатель кварцевых наручных часов и самая честная механика за свои деньги.
  story:
    - В 1881 году 21-летний Кинтаро Хаттори открыл магазин часов в Гиндзе, а в 1892 году основал фабрику Seikosha. Название значит «дом точности».
    - В 1913 году Seiko выпустила первые японские наручные часы Laurel, а 25 декабря 1969 года Astron, первые в мире кварцевые наручные часы. Это открытие изменило всю индустрию.
    - Seiko делает всё сама, от кристаллов кварца до смазок. Её дайверские часы с 1965 года носят профессионалы, а в 1999 году марка представила гибридный механизм Spring Drive.
  facts:
    - {label: "Astron", value: "первые кварцевые наручные часы, 1969"}
    - {label: "Первые дайверы", value: "62MAS, 1965"}
    - {label: "Spring Drive", value: "1999"}
  milestones:
    - {year: 1881, text: "Магазин Кинтаро Хаттори в Гиндзе"}
    - {year: 1892, text: "Фабрика Seikosha"}
    - {year: 1913, text: "Laurel, первые японские наручные часы"}
    - {year: 1965, text: "Первые дайверские часы"}
    - {year: 1969, text: "Astron, кварцевая революция"}
    - {year: 1999, text: "Spring Drive"}

