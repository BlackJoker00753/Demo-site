brand:
  slug: citizen
  name: Citizen
  aliases: [ситизен, цитизен]
  country: japan
  founded: 1918
  founder: Сёкося (Институт исследования часов)
  city: Нисиотокё, Токио
  lat: 35.7255
  lon: 139.5383
  group: Citizen Watch Co.
  tier: accessible
  manufacture: full
  manufacture_note: Одна из крупнейших часовых компаний мира. Ей принадлежат производитель механизмов Miyota, швейцарские La Joux-Perret, Frédérique Constant и американская Bulova.
  website: https://www.citizenwatch.com
  sort: 3
  tagline: Часы, которые заряжаются от любого света. Eco-Drive с 1995 года.
  story:
    - Институт исследования часов Сёкося основали в Токио в 1918 году. В 1924 году мэр Токио Симпэй Гото назвал их карманные часы Citizen, чтобы их любил и мог купить каждый гражданин.
    - В 1976 году Citizen выпустила первые в мире аналоговые часы с солнечной батареей, а в 1995 году технологию Eco-Drive. Часы заряжаются от любого света и месяцами работают в темноте.
    - Сегодня Citizen входит в тройку крупнейших часовых групп мира.
