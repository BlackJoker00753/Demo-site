brand:
  slug: casio
  name: Casio
  aliases: [касио, джи шок, g-shock, джишок]
  country: japan
  founded: 1946
  founder: Тадао Касио
  city: Хамура
  lat: 35.7672
  lon: 139.3108
  group: Casio Computer Co.
  tier: accessible
  manufacture: full
  manufacture_note: Собственные электронные модули, датчики и корпуса. G-Shock разрабатывают в исследовательском центре в Хамуре.
  website: https://www.casio.com
  sort: 4
  tagline: G-Shock, который невозможно разбить, и цифровые часы для всей планеты.
  story:
    - Тадао Касио основал компанию в 1946 году, а в 1957 году выпустил первый в мире компактный электрический калькулятор. Часы Casiotron появились в 1974 году.
    - Инженер Кикуо Ибэ уронил отцовские часы и решил создать часы, которые не разобьются. Проект «Тройная десятка» требовал выдерживать падение с 10 метров, водозащиту 10 бар и 10 лет работы батарейки.
    - Первый G-Shock DW-5000C вышел в 1983 году. С тех пор продано более 150 миллионов G-Shock, а модель F-91W стала одними из самых массовых часов в истории.
  facts:
    - {label: "G-Shock", value: "1983, проект «Тройная десятка»"}
    - {label: "Продано G-Shock", value: "более 150 млн"}
    - {label: "F-91W", value: "с 1989 года"}
  milestones:
