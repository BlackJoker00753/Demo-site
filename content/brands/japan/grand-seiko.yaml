brand:
  slug: grand-seiko
  name: Grand Seiko
  aliases: [гранд сейко, гранд сэйко, gs]
  country: japan
  founded: 1960
  founder: Seiko (Суваси Сэйкося и Даини Сэйкося)
  city: Сидзукуиси
  lat: 39.6958
  lon: 140.9842
  group: Seiko Group
  tier: luxury
  manufacture: full
  manufacture_note: Механику собирают в студии Сидзукуиси у подножия горы Ивате, Spring Drive и кварц в студии Синсю в Сиодзири. Корпуса полируют методом дзарацу.
  website: https://www.grand-seiko.com
  sort: 2
  tagline: Японское совершенство. Полировка дзарацу, Spring Drive и циферблаты, вдохновлённые природой.
  story:
    - Grand Seiko появилась в 1960 году с целью сделать лучшие часы в мире. В 1967 году дизайнер Таро Танака сформулировал «стиль Grand Seiko» с плоскими гранями, отполированными до зеркала без искажений.
    - В 1990-х Seiko довела до серии Spring Drive, механизм с пружиной и электронным тормозом. Его секундная стрелка скользит абсолютно плавно, а точность достигает ±1 секунды в сутки.
    - С 2017 года Grand Seiko работает как отдельная марка. Её циферблаты повторяют снег на горе Ивате, кору белых берёз и воду озера Сува.
  facts:
    - {label: "Полировка", value: "дзарацу, зеркало без искажений"}
    - {label: "Spring Drive", value: "±1 с в сутки"}
    - {label: "Самостоятельная марка", value: "с 2017 года"}
  milestones:
    - {year: 1960, text: "Первые Grand Seiko"}
    - {year: 1967, text: "Стиль Grand Seiko, 44GS"}
    - {year: 1999, text: "Spring Drive"}
    - {year: 2005, text: "Снежинка SBGA011"}
    - {year: 2017, text: "Независимая марка"}
    - {year: 2020, text: "Калибр 9SA5"}

