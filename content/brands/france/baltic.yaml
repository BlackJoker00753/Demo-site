  tagline: Французский нео-винтаж. Чистая эстетика середины XX века и выверенные пропорции.
  story:
    - Французский энтузиаст Этьен Малек создал марку Baltic в память об отце-коллекционере, начав с краудфандинга на Kickstarter в 2017 году.
    - Дизайн Baltic вдохновлен культовыми винтажными часами 1940-х и 1960-х годов с идеальными размерами корпуса до 39 мм.
    - Все часы проектируются в Париже и вручную собираются опытными мастерами в Безансоне.
