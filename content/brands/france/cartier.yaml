  manufacture_note: Исторический парижский дом роскоши. Собственная часовая мануфактура расположена в Ла-Шо-де-Фон в Швейцарии.
  website: https://www.cartier.com
  sort: 1
  tagline: Король ювелиров и ювелир королей. Создатель первых мужских наручных часов.
  story:
    - В 1847 году Луи-Франсуа Картье открыл ювелирную мастерскую в Париже. Принц Уэльский назвал Cartier «ювелиром королей и королём ювелиров».
    - В 1904 году Луи Картье создал для авиатора Альберто Сантос-Дюмона первые в мире мужские наручные часы Santos, чтобы пилот мог сверять время в полёте.
    - В 1917 году Картье нарисовал часы Tank, вдохновившись силуэтом танков союзников. Чистые линии ар-деко сделали модель нестареющей иконой.
