  tagline: Немецкий дизайн Макса Билла и первые наручные часы с радиосинхронизацией.
  story:
    - Эрхард Юнгханс основал фабрику в Шварцвальде в 1861 году. К 1903 году Junghans была крупнейшей часовой фабрикой мира.
    - В 1956 году архитектор и выпускник Баухауса Макс Билл спроектировал для Junghans кухонные часы, а в 1961 году наручные. Их минималистичный дизайн выпускают до сих пор.
    - В 1990 году Junghans MEGA стали первыми наручными часами с радиосинхронизацией времени.
