  manufacture_note: Механизмы Sellita и ETA, но корпуса и технологии свои. Упрочнение стали Tegiment, осушающие капсулы Ar и корпуса из немагнитной подводной стали.
  website: https://www.sinn.de
  sort: 4
  tagline: Инструментальные часы для пилотов, водолазов и спецназа из Франкфурта.
  story:
    - Пилот и лётный инструктор Гельмут Зинн основал компанию в 1961 году, чтобы делать надёжные бортовые и наручные часы для лётчиков.
    - С 1994 года Sinn руководит инженер Лотар Шмидт. Марка известна технологиями. Корпус из стали немецких подводных лодок, покрытие Tegiment, которое почти не царапается, и капсула, вытягивающая влагу из корпуса.
    - В 1985 году астронавт Райнхард Фуррер взял хронограф Sinn 140 S в полёт Spacelab D1. Часы марки выбирают и спецподразделения Германии.
