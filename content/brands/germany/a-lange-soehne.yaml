    icon: true
    story:
      - Lange 1 1994 года нарушил все правила. Циферблат смещён влево, секунды внизу, запас хода справа, а крупная дата в два окна наверху. При этом композиция подчиняется золотому сечению.
      - Большая дата повторяет цифры «пятиминутных часов» Земпер-оперы в Дрездене, построенных придворным часовщиком Гутковым в 1841 году.
