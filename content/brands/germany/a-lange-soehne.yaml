  manufacture_note: Каждый механизм собирают дважды. Мосты баланса гравируют вручную, а камни сидят в золотых шатонах на воронёных винтах.
  website: https://www.alange-soehne.com
  sort: 1
  tagline: Саксонская высокая механика, которая дважды родилась в Глашютте.
  story:
    - В 1845 году дрезденский часовщик Фердинанд Адольф Ланге открыл мастерскую в бедном горняцком городке Глашютте и обучил местных жителей ремеслу. Так возник центр немецкого часового дела.
    - В 1945 году бомбардировка уничтожила фабрику, а в 1948 году компанию национализировали. Имя Ланге исчезло на 42 года.
    - 7 декабря 1990 года правнук основателя Вальтер Ланге вместе с Гюнтером Блюмляйном возродил марку. В 1994 году первая коллекция с Lange 1 произвела сенсацию. Сегодня Lange сравнивают с лучшими швейцарскими мануфактурами.
