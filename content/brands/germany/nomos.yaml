brand:
  slug: nomos
  name: NOMOS Glashütte
  aliases: [номос, nomos]
  country: germany
  founded: 1990
  founder: Роланд Швертнер
  city: Глашютте
  lat: 50.8500
  lon: 13.7830
  independent: true
  tier: mid
  manufacture: full
  manufacture_note: Собственные калибры и даже собственный спуск swing system, что редкость для марки такой цены.
  website: https://nomos-glashuette.com
  sort: 3
  tagline: Баухаус на запястье. Собственные механизмы и честные цены.
  story:
    - Компьютерщик и фотограф Роланд Швертнер зарегистрировал NOMOS в Глашютте 1 января 1990 года, через несколько недель после падения Берлинской стены.
    - Дизайн марки вырос из немецкого Баухауса и Веркбунда 1920-х. Tangente 1992 года с тонкими стрелками и шрифтом без засечек стал классикой современного дизайна.
    - В 2014 году NOMOS представила собственный спусковой механизм swing system. Независимая марка сама делает почти все детали механизмов.
  facts:
    - {label: "Основан", value: "1 января 1990"}
    - {label: "Спуск swing system", value: "собственный с 2014"}
    - {label: "Стиль", value: "Баухаус"}
  milestones:
    - {year: 1990, text: "Основание в Глашютте"}
    - {year: 1992, text: "Tangente"}
    - {year: 2005, text: "Первый собственный калибр"}
    - {year: 2014, text: "Спуск swing system"}

