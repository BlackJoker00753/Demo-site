  tagline: Первые в мире электронные часы с камертоном и лунный хронограф.
  story:
    - Эмигрант из Богемии Джозеф Булова открыл ювелирный магазин на Мейден-Лейн в Нью-Йорке в 1875 году.
    - В 1960 году Bulova потрясла часовой мир моделью Accutron. Вместо баланса регулятором служил вибрирующий камертон с частотой 360 Гц, обеспечивавший беспрецедентную для того времени точность.
    - В августе 1971 года астронавт Дэвид Скотт ступил на поверхность Луны в ходе миссии Аполлон-15 с личным хронографом Bulova на запястье.
