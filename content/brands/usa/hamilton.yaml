  founder: Основан в Ланкастере
  city: Ланкастер
  lat: 40.0379
  lon: -76.3055
  independent: false
  tier: mid
  manufacture: partial
  manufacture_note: Историческая американская марка, сегодня входит в Swatch Group и собирается в Швейцарии.
  website: https://www.hamiltonwatch.com
  sort: 1
  tagline: Часы американских железных дорог, армии США и голливудского кино.
  story:
    - Основанная в Ланкастере, штат Пенсильвания, в 1892 году, Hamilton прославилась точнейшими карманными часами для железных дорог «Watch of Railroad Accuracy».
    - Во время Второй мировой войны Hamilton полностью перевела производство на нужды армии США, выпустив более миллиона военных приборов и часов.
    - В 1957 году марка потрясла мир первой в истории электрической моделью Ventura в асимметричном футуристическом корпусе, которую носил Элвис Пресли.
  facts:
    - {label: "Основан", value: "1892 год в Пенсильвании"}
    - {label: "Военное наследие", value: "Официальный поставщик армии США"}
    - {label: "Кинематограф", value: "Часы в более чем 500 фильмах"}
  milestones:
    - {year: 1892, text: "Основание Hamilton в Ланкастере"}
    - {year: 1914, text: "Официальный хронометрист армии США"}
    - {year: 1957, text: "Электрические часы Ventura"}
    - {year: 2014, text: "Создание часов «Murph» для фильма Интерстеллар"}

