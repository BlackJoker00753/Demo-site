brand:
  slug: iwc
  name: IWC Schaffhausen
  aliases: [iwc, ай дабл ю си, шаффхаузен]
  country: switzerland
  founded: 1868
  founder: Флорентайн Ариосто Джонс
  city: Шаффхаузен
  lat: 47.6973
  lon: 8.6349
  group: Richemont
  tier: luxury
  manufacture: partial
  manufacture_note: Хронографы и крупные калибры IWC делает сама. Часть базовых автоматов выпускает мануфактура группы Richemont ValFleurier.
  website: https://www.iwc.com
  sort: 8
  tagline: Единственная крупная мануфактура на северо-востоке Швейцарии, основанная американцем.
  story:
    - Американский инженер Флорентайн Ариосто Джонс в 1868 году решил соединить швейцарское мастерство с американскими методами производства и открыл International Watch Company в Шаффхаузене. Энергию давала турбина на Рейне.
    - IWC прославилась авиационными часами. Big Pilot 1940 года был создан для штурманов, а Mark XI стал эталоном для британских ВВС.
    - Португизер появился в 1939 году по заказу португальских торговцев, которым нужны были наручные часы с точностью морского хронометра.
  facts:
    - {label: "Португизер", value: "1939"}
    - {label: "Big Pilot", value: "1940"}
    - {label: "Завод Пеллатон", value: "1950, автоподзавод с собачками"}
  milestones:
    - {year: 1868, text: "Основание в Шаффхаузене"}
    - {year: 1939, text: "Португизер"}
    - {year: 1940, text: "Большие часы пилота"}
    - {year: 1948, text: "Mark XI"}
    - {year: 1955, text: "Ingenieur"}
    - {year: 2000, text: "Вошла в Richemont"}

