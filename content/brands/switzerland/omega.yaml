brand:
  slug: omega
  name: Omega
  aliases: [омега]
  country: switzerland
  founded: 1848
  founder: Луи Брандт
  city: Биль
  lat: 47.1330
  lon: 7.2540
  group: Swatch Group
  tier: luxury
  manufacture: full
  manufacture_note: Все современные калибры Omega собственные, с коаксиальным спуском и сертификатом Master Chronometer, выдерживающим магнитное поле 15 000 гаусс.
  website: https://www.omegawatches.com
  sort: 2
  tagline: Часы, побывавшие на Луне, и официальный хронометрист Олимпийских игр.
  story:
    - Луи Брандт открыл мастерскую в Ла-Шо-де-Фоне в 1848 году. Его сыновья перенесли производство в Биль, а в 1894 году выпустили калибр Omega, настолько удачный, что его имя стало названием всей компании.
    - С 1932 года Omega хронометрирует Олимпийские игры. В 1965 году NASA после жёстких испытаний выбрало Speedmaster, и в 1969 году он оказался на Луне на руке Базза Олдрина.
    - В 1999 году марка первой запустила в серию коаксиальный спуск английского мастера Джорджа Дэниелса. С 2015 года её калибры проходят испытания METAS и называются Master Chronometer.
  facts:
    - {label: "На Луне", value: "Speedmaster, 21 июля 1969"}
    - {label: "Олимпиады", value: "официальный хронометрист с 1932"}
    - {label: "Спуск", value: "коаксиальный, Джордж Дэниелс"}
