watches:
  - slug: omega-speedmaster-moonwatch
    name: Speedmaster Moonwatch Professional
    collection: Speedmaster
    reference: 310.30.42.50.01.001
    year_introduced: 1957
    year_current: 2021
    movement: omega-3861
    complications: [chronograph, tachymeter, small-seconds]
    case: {diameter_mm: 42, thickness_mm: 13.2, material: Сталь, water_resistance_m: 50, crystal: Гесалит (акрил), lug_width_mm: 20}
    bracelet: Стальной браслет, пять звеньев
    dial: Чёрный матовый «ступенчатый»
    price: {usd: 7800, kind: msrp, source: omegawatches.com (US), url: "https://www.omegawatches.com/en-us/watches/speedmaster/moonwatch-professional/catalog", checked: 2026-09-24}
    summary: Единственные часы, сертифицированные NASA для выхода в открытый космос. Первые часы на Луне.
    icon: true
    story:
      - Speedmaster появился в 1957 году как хронограф для автогонщиков и инженеров. Тахиметр на безеле вместо циферблата был смелым решением.
      - "В 1962 году астронавты начали покупать эти часы сами, а в 1965 году NASA провело серию испытаний: жар, холод, вакуум, удары, вибрации. Выдержал только Speedmaster."
      - 21 июля 1969 года Базз Олдрин вышел на поверхность Луны в Speedmaster. Через год часы помогли экипажу Apollo 13 рассчитать 14 секунд работы двигателя для возвращения на Землю.
      - Современная версия сохранила ручной завод, гесалитовое стекло и асимметричный корпус, но получила калибр 3861 с коаксиальным спуском.
    history:
      - {year: 1957, ref: "CK2915", title: "Первый Speedmaster", text: "Стрелки «широкая стрела», калибр 321 и стальной безель с тахиметром."}
      - {year: 1965, ref: "ST 105.003", title: "Выбор NASA", text: "Прошёл все испытания и стал официальными часами для космических полётов."}
      - {year: 1969, ref: "ST 105.012", title: "На Луне", text: "Apollo 11. С этого момента модель называют Moonwatch."}
      - {year: 1970, title: "Apollo 13", text: "Хронограф помог отсчитать 14 секунд работы двигателя при аварийном возвращении."}
      - {year: 1996, ref: "3570.50", title: "Калибр 1861", text: "Надёжная версия с ручным заводом, выпускалась четверть века."}
      - {year: 2021, ref: "310.30.42.50.01.001", title: "Master Chronometer", text: "Калибр 3861 с коаксиальным спуском и новым браслетом."}
    highlights: [Сертифицированы NASA, Ручной завод, Калибр 3861 Master Chronometer, Гесалитовое стекло как в 1969]
    render:
      case: {shape: round, material: steel, pushers: 2, lugs: twisted}
      bezel: {type: tachymeter, color: "#0e0f11", material: aluminium}
      dial: {color: "#0c0d0f", finish: matte, indices: baton, track: railway}
      hands: {style: baton, color: "#e9ecef"}
      subdials:
