    - {year: 1948, text: "Seamaster"}
    - {year: 1957, text: "Speedmaster"}
    - {year: 1969, text: "Speedmaster на Луне"}
    - {year: 1999, text: "Коаксиальный спуск в серии"}
    - {year: 2015, text: "Сертификат Master Chronometer"}

