brand:
  slug: tissot
  name: Tissot
  aliases: [тиссо, тиссот]
  country: switzerland
  founded: 1853
  founder: Шарль-Фелисьен Тиссо и Шарль-Эмиль Тиссо
  city: Ле-Локль
  lat: 47.0569
  lon: 6.7489
  group: Swatch Group
  tier: accessible
  manufacture: none
  manufacture_note: Механизмы поставляет ETA из той же группы Swatch. Главный козырь марки, калибр Powermatic 80 с запасом хода трое суток.
  website: https://www.tissotwatches.com
  sort: 13
  tagline: Самые продаваемые швейцарские механические часы и лучший вход в мир Swiss Made.
  story:
    - Отец и сын Тиссо открыли мастерскую в Ле-Локле в 1853 году. Шарль-Эмиль вскоре уехал в Россию и сделал Tissot поставщиком часов для российского двора и дворянства.
    - В 1930 году Tissot выпустила первые антимагнитные часы, а в 1971 году IDEA 2001, одни из первых часов с корпусом из пластика.
    - Сегодня марка принадлежит Swatch Group и продаёт миллионы часов в год. Её PRX 2021 года вернул моду на интегрированный браслет в доступном сегменте.
  facts:
    - {label: "Россия", value: "поставщик императорского двора"}
    - {label: "Первые антимагнитные", value: "1930"}
    - {label: "Powermatic 80", value: "80 часов запаса хода"}
  milestones:
    - {year: 1853, text: "Основание в Ле-Локле"}
    - {year: 1930, text: "Первые антимагнитные часы"}
    - {year: 1978, text: "Первый PRX"}
    - {year: 2021, text: "Возрождение PRX"}

