brand:
  slug: jaeger-lecoultre
  name: Jaeger-LeCoultre
  aliases: [жагер, жежер лекультр, jlc, джей эл си]
  country: switzerland
  founded: 1833
  founder: Антуан Лекультр
  city: Ле-Сантье
  lat: 46.6089
  lon: 6.2239
  group: Richemont
  tier: luxury
  manufacture: full
  manufacture_note: «Гранд-мезон» долины Жу. Под одной крышей около 180 ремёсел, а за историю мануфактура создала более 1 200 калибров и поставляла механизмы многим именитым маркам.
  website: https://www.jaeger-lecoultre.com
  sort: 7
  tagline: Часовщик для часовщиков и создатель Reverso с переворачивающимся корпусом.
  story:
    - Антуан Лекультр открыл мастерскую в Ле-Сантье в 1833 году и изобрёл миллионометр, первый инструмент, измеряющий микрон. Мануфактура быстро стала поставщиком механизмов для Женевы.
    - В 1931 году для игроков в поло в Британской Индии создали Reverso. Корпус переворачивался, защищая стекло от ударов клюшкой. Сегодня это одна из главных икон ар-деко.
    - Jaeger-LeCoultre делала самый маленький механический калибр в мире (101, 1929), вечные часы Atmos, заводящиеся от перепадов температуры, и десятки сложнейших механизмов.
  facts:
    - {label: "Калибров создано", value: "более 1 200"}
    - {label: "Reverso", value: "1931, для игроков в поло"}
    - {label: "Самый маленький механизм", value: "калибр 101, 1929"}
  milestones:
