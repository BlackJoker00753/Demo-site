    dial: Солнечный с вертикальной фактурой
    price: {usd: 11400, kind: msrp, source: jaeger-lecoultre.com (US), checked: 2026-09-24}
    summary: Корпус, который переворачивается на 180 градусов. Икона ар-деко с 1931 года.
    icon: true
    story:
      - По легенде, британские офицеры в Индии пожаловались, что при игре в поло разбивают стёкла часов. Сезар де Трей предложил корпус, который можно перевернуть металлической крышкой наружу.
      - Патент получили в 1931 году, а производство взяла на себя LeCoultre. Название Reverso в переводе с латыни значит «я переворачиваюсь».
      - Прямоугольная форма с тремя горизонтальными гадронами наверху и внизу стала классикой ар-деко. На обратной стороне часто гравируют инициалы владельца.
    history:
      - {year: 1931, title: "Для поло", text: "Патент на переворачивающийся корпус."}
      - {year: 1991, ref: "Reverso Grande Taille", title: "Большой Reverso", text: "Увеличенный корпус к 60-летию модели."}
      - {year: 2016, title: "Reverso Tribute", text: "Коллекция, возвращающая пропорции 1930-х."}
    highlights: [Переворачивающийся корпус, Ручной завод, Место для гравировки на обороте]
