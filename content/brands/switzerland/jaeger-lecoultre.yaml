    - {year: 1928, text: "Часы Atmos"}
    - {year: 1929, text: "Калибр 101"}
    - {year: 1931, text: "Reverso"}
    - {year: 1937, text: "Имя Jaeger-LeCoultre"}
    - {year: 1968, text: "Memovox Polaris"}

