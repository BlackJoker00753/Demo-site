  tagline: Швейцарская марка, основанная в Санкт-Петербурге. Мастера дымчатых циферблатов «фюме».
  story:
    - Шаффхаузенец Генрих Мозер в 1828 году открыл часовой бизнес в Санкт-Петербурге и стал одним из главных поставщиков часов в Российской империи. Его часы носили офицеры и чиновники, а сам он вернулся в Швейцарию богатым промышленником.
    - После революции 1917 года российский бизнес Мозера национализировали. Марку возродили в 2005 году в Шаффхаузене.
    - Сегодня Moser знаменита минималистичными циферблатами «фюме» с градиентом от центра к краю и дерзким юмором, например часами без логотипа.
