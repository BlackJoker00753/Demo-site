brand:
  slug: tudor
  name: Tudor
  aliases: [тюдор, тудор]
  country: switzerland
  founded: 1926
  founder: Ханс Вильсдорф
  city: Женева
  lat: 46.1920
  lon: 6.1330
  group: Фонд Ханса Вильсдорфа
  independent: true
  tier: premium
  manufacture: partial
  manufacture_note: С 2015 года большинство моделей работает на собственных калибрах серии MT, которые делает дочерняя мануфактура Kenissi. В доступных линейках стоят доработанные покупные механизмы.
  website: https://www.tudorwatch.com
  sort: 3
  tagline: Младший брат Rolex, который давно вырос в самостоятельную легенду инструментальных часов.
  story:
    - В 1926 году часовой дом Veuve de Philippe Hüther зарегистрировал для Ханса Вильсдорфа марку The Tudor. Идея была простой. Предложить надёжность корпуса Oyster по более доступной цене.
    - В 1950-х Tudor поставляла дайверские часы военно-морским силам нескольких стран. Французский флот носил модели со стрелками «снежинка», которые стали фирменной чертой марки.
    - Возрождение началось в 2012 году с Black Bay. Сегодня Tudor сама разрабатывает механизмы с запасом хода 70 часов и хронометрической сертификацией.
  facts:
    - {label: "Механизмы", value: "собственные калибры MT, мануфактура Kenissi"}
    - {label: "Стрелки «снежинка»", value: "с 1969 года"}
    - {label: "Запас хода", value: "70 часов у калибров MT"}
  milestones:
    - {year: 1926, text: "Регистрация марки The Tudor"}
    - {year: 1946, text: "Основана компания Montres Tudor SA"}
    - {year: 1954, text: "Первые дайверские часы ref. 7922"}
    - {year: 1969, text: "Стрелки «снежинка» для французского флота"}
    - {year: 2012, text: "Коллекция Black Bay"}
    - {year: 2015, text: "Первый собственный калибр MT5621"}
    - {year: 2018, text: "Black Bay 58 и Black Bay GMT"}

