    summary: Дайвер 39 мм с винтажной душой. Размер и пропорции 1950-х, современный калибр на 70 часов.
    icon: true
    story:
      - Black Bay 58 назван в честь 1958 года, когда вышли часы ref. 7924 «Big Crown» с водонепроницаемостью 200 метров. Их 39-миллиметровый корпус стал образцом для современной модели.
      - Золотистые надписи, «снежинка» на часовой стрелке и браслет с заклёпками отсылают к истории, а калибр MT5402 с хронометрическим сертификатом делает часы современным инструментом.
      - Модель стала хитом с первого дня. Многие называют её лучшими дайверскими часами до 5 тысяч долларов.
    history:
      - {year: 1954, ref: "7922", title: "Первый дайвер Tudor", text: "Oyster Prince Submariner с водонепроницаемостью 100 метров."}
      - {year: 1958, ref: "7924", title: "Big Crown", text: "200 метров и крупная заводная головка. Прообраз Black Bay 58."}
      - {year: 1969, ref: "7016", title: "Снежинка", text: "Стрелки с квадратным наконечником для французского флота."}
      - {year: 2018, ref: "79030N", title: "Black Bay 58", text: "39 мм, собственный калибр MT5402, золотистые акценты."}
    highlights: ["39 мм и 11,9 мм толщины", "Калибр MT5402 с сертификатом COSC", "Стрелки «снежинка»"]
