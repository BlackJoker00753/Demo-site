  story:
    - Основанная в Ле-Локле в 1846 году, компания завоевала свыше 4300 наград за точность и снабжала морскими палубными хронометрами более 50 военных флотов мира.
    - "В 2001 году под руководством Рольфа Шнайдера и часовщика-визионера Людвига Окслина дом выпустил модель Freak, навсегда изменившую часовую индустрию: это были первые часы со спуском из кремния, не требующие смазки, без циферблата, стрелок и традиционной заводной головки."
    - С тех пор Ulysse Nardin развивает концепцию механического карусельного турбийона, где сам механизм совершает один оборот в час, выполняя роль минутной стрелки.
