  manufacture: full
  manufacture_note: Большинство моделей несут Женевское клеймо, которое требует сборки, отделки и проверки механизма в кантоне Женева.
  website: https://www.vacheron-constantin.com
  sort: 6
  tagline: Старейшая мануфактура, работающая без перерыва с 1755 года.
  story:
    - 17 сентября 1755 года 24-летний Жан-Марк Вашерон нанял первого ученика. Контракт сохранился, и с тех пор мануфактура не прекращала работу ни на один год.
    - В 1819 году к семье присоединился коммерсант Франсуа Константен. Его девиз «Делать лучше, если возможно, а это возможно всегда» до сих пор служит девизом дома.
    - Vacheron Constantin создавала часы для королей и магнатов, а в 2015 году к 260-летию собрала карманные часы Reference 57260 с 57 усложнениями.
  facts:
    - {label: "Работает без перерыва", value: "с 1755 года"}
    - {label: "Эмблема", value: "Мальтийский крест"}
    - {label: "Самые сложные часы", value: "Les Cabinotiers Berkley, 63 усложнения"}
  milestones:
    - {year: 1755, text: "Контракт с первым учеником"}
