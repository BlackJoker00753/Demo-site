    - {year: 1880, text: "Мальтийский крест становится эмблемой"}
    - {year: 1977, text: "Модель 222 Йорга Хизека"}
    - {year: 1996, text: "Коллекция Overseas"}
    - {year: 2015, text: "Reference 57260, 57 усложнений"}

