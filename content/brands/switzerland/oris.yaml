brand:
  slug: oris
  name: Oris
  aliases: [орис]
  country: switzerland
  founded: 1904
  founder: Поль Каттен и Жорж Кристиан
  city: Хёльштайн
  lat: 47.4230
  lon: 7.7700
  independent: true
  tier: mid
  manufacture: partial
  manufacture_note: С 2020 года Oris выпускает собственный калибр 400. В остальных моделях стоят доработанные механизмы Sellita.
  website: https://www.oris.ch
  sort: 19
  tagline: Независимая марка из Хёльштайна. Механика, экология и красная точка на роторе.
  story:
    - Поль Каттен и Жорж Кристиан открыли фабрику в деревне Хёльштайн в 1904 году и назвали её в честь ближайшего ручья. К 1930-м Oris была крупнейшим работодателем в регионе.
    - В 1982 году менеджмент выкупил компанию у группы ASUAG и решил выпускать только механические часы. Этот выбор помог пережить кварцевый кризис.
    - Oris остаётся независимой и известна экологическими проектами. Калибр 400 2020 года получил пять суток запаса хода и 10 лет гарантии.
  facts:
    - {label: "Независимость", value: "с 1982 года"}
    - {label: "Калибр 400", value: "120 часов, 10 лет гарантии"}
    - {label: "Фирменный знак", value: "красный ротор"}
  milestones:
