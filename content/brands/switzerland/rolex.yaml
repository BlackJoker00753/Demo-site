brand:
  slug: rolex
  name: Rolex
  aliases: [ролекс, ролекс ойстер]
  country: switzerland
  founded: 1905
  founder: Ханс Вильсдорф и Альфред Дэвис
  city: Женева
  lat: 46.1893
  lon: 6.1296
  group: Фонд Ханса Вильсдорфа
  independent: true
  tier: luxury
  manufacture: full
  manufacture_note: Все механизмы, корпуса, браслеты и даже золото Rolex делает сама на четырёх площадках в Женеве и Биле.
  website: https://www.rolex.com
  sort: 1
  tagline: Самая узнаваемая часовая марка мира и эталон надёжных инструментальных часов.
  story:
    - Ханс Вильсдорф основал компанию в Лондоне в 1905 году, а в 1908 зарегистрировал короткое название Rolex, одинаково читаемое на любом языке. В 1919 году из-за военных пошлин фирма переехала в Женеву.
    - Вильсдорф верил, что наручные часы могут быть точнее карманных. В 1910 году Rolex получила первый в истории сертификат хронометра для наручных часов, а в 1926 году создала Oyster, первый по-настоящему водонепроницаемый корпус.
    - В 1931 году появился ротор Perpetual, прародитель всех современных автоматов. С середины века марка создаёт инструменты для дайверов, пилотов и альпинистов, которые потом стали иконами стиля.
    - С 1960 года Rolex принадлежит благотворительному фонду Ханса Вильсдорфа и не торгуется на бирже. Производство оценивается примерно в 1,2 миллиона часов в год.
  facts:
    - {label: Сертификация, value: "Superlative Chronometer, ±2 с в сутки"}
    - {label: Производство, value: "около 1,2 млн часов в год (оценка)"}
    - {label: Сталь, value: "Oystersteel 904L"}
    - {label: Владелец, value: "фонд, без акционеров"}
  milestones:
    - {year: 1905, text: "Основание Wilsdorf & Davis в Лондоне"}
    - {year: 1910, text: "Первый сертификат хронометра для наручных часов"}
    - {year: 1926, text: "Водонепроницаемый корпус Oyster"}
    - {year: 1931, text: "Ротор Perpetual, автоподзавод"}
    - {year: 1945, text: "Datejust, дата в окошке"}
    - {year: 1953, text: "Submariner и Explorer"}
    - {year: 1963, text: "Cosmograph Daytona"}
    - {year: 2025, text: "Land-Dweller и спуск Dynapulse на 5 Гц"}

