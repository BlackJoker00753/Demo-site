  - slug: rolex-cosmograph-daytona
    name: Cosmograph Daytona
    collection: Cosmograph Daytona
    reference: 126500LN
    year_introduced: 1963
    year_current: 2023
    movement: rolex-4131
    complications: [chronograph, tachymeter]
    case: {diameter_mm: 40, thickness_mm: 11.9, material: Oystersteel, water_resistance_m: 100, lug_width_mm: 20}
    bracelet: Oyster
    dial: Белый «панда» с чёрными счётчиками
    price: {usd: 16900, kind: msrp, source: rolex.com (US), checked: 2026-09-24, note: прайс-лист Rolex 2026 для США}
    summary: Хронограф гонщиков Дайтоны и самые желанные стальные часы в мире.
    icon: true
    story:
      - В 1963 году Rolex выпустила хронограф Cosmograph для автогонщиков, а название Daytona добавила в честь трассы во Флориде, где проходили скоростные заезды.
      - Поначалу модель продавалась плохо. Всё изменилось, когда актёр и гонщик Пол Ньюман стал носить Daytona с необычным циферблатом. Его собственный экземпляр в 2017 году продали на аукционе за 17,8 миллиона долларов.
      - В 1988 году Daytona получила автоподзавод на основе механизма Zenith El Primero, а в 2000 году Rolex поставила полностью собственный калибр 4130. Нынешняя версия 2023 года работает на калибре 4131.
    history:
      - {year: 1963, ref: "6239", title: Первый Cosmograph, text: "Ручной завод, механизм Valjoux 72, шкала тахиметра на безеле."}
      - {year: 1965, ref: "6240", title: Завинчивающиеся кнопки, text: "Кнопки хронографа стали завинчиваться для защиты от воды."}
      - {year: 1988, ref: "16520", title: Автоподзавод, text: "Калибр 4030 на базе Zenith El Primero, корпус 40 мм и сапфир."}
      - {year: 2000, ref: "116520", title: Собственный калибр, text: "Калибр 4130, один из лучших серийных хронографов."}
      - {year: 2016, ref: 116500LN, title: Керамический безель, text: "Чёрный безель Cerachrom в стальной модели."}
      - {year: 2023, ref: 126500LN, title: 60 лет, text: "Калибр 4131 и тонкая металлическая рамка вокруг керамики."}
    highlights: [Хронограф с колонным колесом, Тахиметр на безеле, 72 часа запаса хода]
