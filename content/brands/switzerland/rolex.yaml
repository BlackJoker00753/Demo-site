      - Корпус Oyster появился в 1926 году. Через год пловчиха Мерседес Глейтце переплыла Ла-Манш с такими часами на шее, и Вильсдорф выкупил первую полосу Daily Mail, чтобы рассказать об этом.
      - Oyster Perpetual сегодня является входной дверью в мир Rolex. Та же сталь, тот же хронометрический калибр, никаких усложнений и яркие цветные циферблаты.
