  - slug: rolex-submariner-date
    name: Submariner Date
    collection: Submariner
    reference: 126610LN
    year_introduced: 1953
    year_current: 2020
    designer: Рене-Поль Жаннере (идея модели)
    movement: rolex-3235
    complications: [date, dive-bezel]
    case: {diameter_mm: 41, thickness_mm: 12.5, material: Oystersteel, water_resistance_m: 300, lug_width_mm: 21}
    bracelet: Oyster с застёжкой Glidelock
    dial: Чёрный лаковый, люминофор Chromalight
    price: {usd: 11350, kind: msrp, source: rolex.com (US), url: "https://www.rolex.com/en-us/watches/submariner/m126610ln-0001", checked: 2026-09-24}
    summary: Эталон часов для дайвинга. С 1953 года образец, на который равняется вся индустрия.
    icon: true
    story:
      - В начале 1950-х директор Rolex и увлечённый дайвер Рене-Поль Жаннере предложил сделать часы для погружений, которые можно носить и в городе. Так появился Submariner, первые часы с водонепроницаемостью 100 метров.
      - Вращающийся безель позволял дайверу засечь начало погружения и контролировать запас воздуха. Крупные светящиеся метки читались в темноте на глубине.
      - Модель снимали в кино о Джеймсе Бонде, носили военные водолазы и исследователи. Постепенно Submariner стал самыми копируемыми часами в мире.
      - Нынешнее поколение 2020 года получило корпус 41 мм, керамический безель Cerachrom, который не выцветает, и калибр 3235 с запасом хода 70 часов.
    history:
      - {year: 1953, ref: "6204", title: Рождение легенды, text: "Первый Submariner, 100 метров и вращающийся безель. Показан публике в 1954 году."}
      - {year: 1959, ref: "5512", title: Защита заводной головки, text: "Появились «плечи», которые защищают головку от ударов. Глубина выросла до 200 метров."}
      - {year: 1969, ref: "1680", title: Первая дата, text: "Submariner получил дату и увеличительную линзу Cyclops."}
      - {year: 1979, ref: "16800", title: Сапфир и 300 метров, text: "Сапфировое стекло вместо пластика, быстрая перестановка даты и 300 метров."}
      - {year: 1989, ref: "16610", title: Классика двух десятилетий, text: "Калибр 3135 и тот самый облик, который выпускали до 2010 года."}
      - {year: 2010, ref: 116610LN, title: Керамика, text: "Безель Cerachrom, массивный корпус и светящаяся масса Chromalight."}
      - {year: 2020, ref: 126610LN, title: Современный Submariner, text: "Корпус 41 мм, калибр 3235 и 70 часов запаса хода."}
