      - 29 мая 1953 года Эдмунд Хиллари и Тенцинг Норгей поднялись на Эверест. Экспедиция была оснащена часами Rolex Oyster Perpetual, и в том же году марка выпустила модель Explorer.
      - Дизайн почти не менялся семьдесят лет. Цифры 3, 6 и 9, треугольник на 12 и стрелки «Мерседес» созданы для мгновенного чтения в перчатках, на холоде и в темноте.
