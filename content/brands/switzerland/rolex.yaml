    price: {usd: 12000, kind: msrp, source: rolex.com (US), checked: 2026-09-24, note: версия на браслете Jubilee}
    summary: Часы пилотов Pan Am. Красно-синий безель делит сутки на день и ночь.
    icon: true
    story:
      - В 1954 году авиакомпания Pan American попросила Rolex сделать часы, по которым экипаж трансатлантических рейсов видел бы время двух поясов сразу. Так появился GMT-Master с четвёртой 24-часовой стрелкой.
      - Двухцветный безель показывает день синим и ночь красным. Прозвище «Pepsi» появилось из-за сходства с логотипом напитка.
      - В 1983 году часовую стрелку GMT-Master II сделали независимой. Пилот может сменить местное время прыжками по часу, не останавливая часы.
    history:
      - {year: 1954, ref: "6542", title: Для Pan Am, text: "Безель из бакелита с люминесцентными цифрами, стрелка GMT."}
      - {year: 1959, ref: "1675", title: Плечи для головки, text: "Алюминиевый безель и защита заводной головки."}
      - {year: 1983, ref: "16760", title: GMT-Master II, text: "Независимая часовая стрелка. Прозвище «Fat Lady» за толстый корпус."}
      - {year: 2005, ref: 116710LN, title: Керамика, text: "Первый безель Cerachrom в чёрном цвете."}
      - {year: 2014, ref: 116719BLRO, title: Двухцветная керамика, text: "Rolex научилась делать красно-синюю керамику, сначала в белом золоте."}
      - {year: 2018, ref: 126710BLRO, title: Pepsi в стали, text: "Стальная версия на браслете Jubilee и калибр 3285."}
    highlights: [Два часовых пояса, Двухцветная керамика Cerachrom, Независимая часовая стрелка]
