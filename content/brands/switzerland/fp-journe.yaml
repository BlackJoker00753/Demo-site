  manufacture_note: Все платины и мосты механизмов изготавливаются из цельного 18-каратного розового золота на собственной мануфактуре в центре Женевы.
  website: https://www.fpjourne.com
  sort: 25
  tagline: "«Invenit et Fecit» (Изобрёл и создал): независимый гений с калибрами из цельного золота."
  story:
    - Франсуа-Поль Журн, потомственный марсельский часовщик и реставратор старинных хронометров Бреге и Жанвье, основал собственную мануфактуру в Женеве в 1999 году под девизом «Invenit et Fecit».
    - Журн совершил революцию в современном часовом деле, начав изготавливать платины и мосты всех своих механизмов исключительно из цельного 18-каратного розового золота.
    - Мануфактура выпускает менее 1000 экземпляров в год, сохраняя бескомпромиссную ручную отделку и создавая сложнейшие калибры с резонансом и ремонтиром постоянной силы.
  facts:
    - {label: "Девиз", value: "«Invenit et Fecit»"}
    - {label: "Материал калибров", value: "Цельное 18-каратное розовое золото"}
    - {label: "Годовой объём", value: "Около 900 экземпляров"}
  milestones:
    - {year: 1999, text: "Основание мануфактуры в Женеве и презентация Tourbillon Souverain"}
    - {year: 2000, text: "Премьера первого в мире наручного хронометра с резонансом Chronomètre à Résonance"}
    - {year: 2004, text: "Переход на изготовление всех механизмов из розового золота 18k"}
    - {year: 2005, text: "Выпуск Chronomètre Souverain, победа на Женевском Гран-при GPHG"}
    - {year: 2009, text: "Дебют культового Chronomètre Bleu в корпусе из тантала"}

