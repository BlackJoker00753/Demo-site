brand:
  slug: tag-heuer
  name: TAG Heuer
  aliases: [таг хоер, таг хойер, хойер, heuer]
  country: switzerland
  founded: 1860
  founder: Эдуар Хойер
  city: Ла-Шо-де-Фон
  lat: 47.1035
  lon: 6.8328
  group: LVMH
  tier: premium
  manufacture: partial
  manufacture_note: Хронографы Heuer 02 марка делает сама. В трёхстрелочных моделях стоят доработанные механизмы на базе Sellita.
  website: https://www.tagheuer.com
  sort: 14
  tagline: "Хронографы автогонок: Carrera, Monaco и Стив Маккуин."
  story:
    - Эдуар Хойер открыл мастерскую в Сент-Имье в 1860 году и в 1887 году запатентовал качающуюся шестерню, которая до сих пор используется в хронографах.
    - В 1916 году Mikrograph впервые измерял время с точностью до сотой доли секунды. В 1969 году Heuer вместе с партнёрами выпустила Calibre 11, один из первых автоматических хронографов.
    - Квадратный Monaco прославил Стив Маккуин в фильме «Ле-Ман» 1971 года. В 1985 году компанию купила группа TAG, а в 1999 году марка вошла в LVMH.
  facts:
    - {label: "Качающаяся шестерня", value: "патент 1887"}
    - {label: "Mikrograph", value: "1/100 секунды, 1916"}
    - {label: "Monaco", value: "первый квадратный водонепроницаемый хронограф-автомат"}
  milestones:
    - {year: 1860, text: "Основание Эдуаром Хойером"}
    - {year: 1887, text: "Качающаяся шестерня"}
    - {year: 1963, text: "Carrera"}
    - {year: 1969, text: "Monaco и Calibre 11"}
    - {year: 1985, text: "TAG Heuer"}
    - {year: 2017, text: "Калибр Heuer 02"}

