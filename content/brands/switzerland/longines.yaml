      - В 1925 году Longines выпустила Zulu Time, одни из первых часов, показывающих время нескольких поясов. Буква Z в авиации обозначает время по Гринвичу.
      - Современный Spirit Zulu Time 2022 года стал одним из лучших GMT в своём классе благодаря хронометрическому калибру с независимой часовой стрелкой.
