brand:
  slug: longines
  name: Longines
  aliases: [лонжин, лонгинес]
  country: switzerland
  founded: 1832
  founder: Огюст Агассис
  city: Сент-Имье
  lat: 47.1526
  lon: 6.9964
  group: Swatch Group
  tier: premium
  manufacture: partial
  manufacture_note: Механизмы для Longines эксклюзивно делает ETA по собственным спецификациям марки, многие с кремниевой спиралью и хронометрическим сертификатом.
  website: https://www.longines.com
  sort: 12
  tagline: Крылатые песочные часы, авиация и лучшая классика за свои деньги.
  story:
    - Огюст Агассис открыл часовую контору в Сент-Имье в 1832 году. Его племянник Эрнест Франсийон в 1867 году построил фабрику на лугах, которые местные называли Les Longines.
    - Логотип с крылатыми песочными часами зарегистрирован в 1889 году. Он считается старейшим неизменным товарным знаком, до сих пор зарегистрированным в ВОИС.
    - Longines хронометрировала первые авиарекорды. В 1931 году по идее Чарльза Линдберга она создала часы с часовым углом для навигации, а в 1936 году выпустила один из первых хронографов флайбэк.
  facts:
    - {label: "Логотип", value: "с 1889 года без изменений"}
    - {label: "Часы Линдберга", value: "Hour Angle, 1931"}
    - {label: "Флайбэк", value: "калибр 13ZN, 1936"}
  milestones:
    - {year: 1832, text: "Основание в Сент-Имье"}
    - {year: 1867, text: "Фабрика на лугах Les Longines"}
    - {year: 1889, text: "Крылатые песочные часы"}
    - {year: 1931, text: "Hour Angle Линдберга"}
    - {year: 1936, text: "Флайбэк 13ZN"}
    - {year: 2020, text: "Коллекция Spirit"}

