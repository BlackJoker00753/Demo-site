brand:
  slug: zenith
  name: Zenith
  aliases: [зенит, зенис]
  country: switzerland
  founded: 1865
  founder: Жорж Фавр-Жако
  city: Ле-Локль
  lat: 47.0590
  lon: 6.7440
  group: LVMH
  tier: luxury
  manufacture: full
  manufacture_note: Одна из немногих полноценных мануфактур. Легендарный высокочастотный хронограф El Primero работает с 1969 года.
  website: https://www.zenith-watches.com
  sort: 16
  tagline: Дом El Primero, первого автоматического хронографа с частотой 5 Гц.
  story:
    - Жорж Фавр-Жако в 22 года основал в Ле-Локле мануфактуру, где впервые собрал все этапы производства под одной крышей. Его компания получила более двух тысяч наград за точность.
    - В 1969 году Zenith представила El Primero, интегрированный автоматический хронограф с частотой 36 000 полуколебаний в час, измеряющий десятые доли секунды.
    - Во время кварцевого кризиса руководство приказало уничтожить оснастку El Primero. Инженер Шарль Вермо спрятал её на чердаке, и в 1984 году производство легенды удалось возобновить.
  facts:
    - {label: "El Primero", value: "1969, 36 000 пк/ч"}
    - {label: "Спаситель", value: "Шарль Вермо спрятал оснастку"}
    - {label: "Премии за точность", value: "более 2 300"}
  milestones:
