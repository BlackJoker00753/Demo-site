brand:
  slug: audemars-piguet
  name: Audemars Piguet
  aliases: [ап, одемар пиге, одемар, ap]
  country: switzerland
  founded: 1875
  founder: Жюль-Луи Одемар и Эдвард-Огюст Пиге
  city: Ле-Брассю
  lat: 46.5835
  lon: 6.2140
  group: Семьи Одемар и Пиге
  independent: true
  tier: haute
  manufacture: full
  manufacture_note: Мануфактура в Ле-Брассю делает собственные механизмы, от простых автоматов до минутных репетиров.
  website: https://www.audemarspiguet.com
  sort: 5
  tagline: Независимая мануфактура из долины Жу, подарившая миру Royal Oak.
  story:
    - В 1875 году два друга, Жюль-Луи Одемар и Эдвард-Огюст Пиге, открыли мастерскую в деревне Ле-Брассю в долине Жу. Они специализировались на сложных механизмах, и уже в 1892 году создали наручные часы с минутным репетиром.
    - В 1972 году Audemars Piguet совершила революцию. Royal Oak Жеральда Женты стал первыми роскошными спортивными часами из стали и стоил дороже многих золотых.
    - Компания до сих пор принадлежит потомкам основателей. Это одна из «святой троицы» швейцарского часового дела вместе с Patek Philippe и Vacheron Constantin.
  facts:
    - {label: "Владельцы", value: "семьи основателей"}
    - {label: "Производство", value: "около 50 тысяч часов в год (оценка)"}
