    designer: Жеральд Жента
    movement: ap-4302
    complications: [date]
    case: {diameter_mm: 41, thickness_mm: 10.4, material: Сталь, water_resistance_m: 50}
    bracelet: Интегрированный стальной браслет
    dial: Синий «Гранд Таписсери»
    price: {usd: 31900, kind: estimate, source: "wristcheck.com, розница США 2026", checked: 2026-09-24, note: "по разным источникам $28 900-31 900"}
    summary: Восьмиугольный безель с восемью винтами и узор «гобелен». Часы, которые придумали роскошный стальной спорт.
    icon: true
    story:
      - В 1971 году, за день до выставки в Базеле, дизайнеру Жеральду Женте позвонил директор Audemars Piguet и попросил к утру нарисовать «стальные часы, каких ещё не было». Женте вдохновился водолазным шлемом с восемью болтами.
      - Royal Oak 1972 года стоил дороже золотого Patek Philippe и поначалу продавался плохо. Сегодня это одна из самых узнаваемых и востребованных моделей в мире.
      - Узор циферблата «Tapisserie» гравируют на старинных пантографах. Грани корпуса и браслета чередуют сатинирование и полировку, что требует сотен операций вручную.
    history:
      - {year: 1972, ref: "5402ST", title: "Первый Royal Oak", text: "39 мм, ультратонкий калибр 2121. Позже получил прозвище «Джамбо»."}
      - {year: 1993, ref: "25721ST", title: "Offshore", text: "Массивный брат Royal Oak, которого называли «зверем»."}
      - {year: 2012, ref: "15400ST", title: "41 мм", text: "Самый популярный размер Royal Oak."}
      - {year: 2022, ref: "15510ST", title: "Калибр 4302", text: "Современный механизм с запасом хода 70 часов."}
    highlights: [Дизайн Жеральда Женты, Восемь шестигранных винтов, Узор «Гранд Таписсери», 70 часов]
