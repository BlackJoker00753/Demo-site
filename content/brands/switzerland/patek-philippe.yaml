brand:
  slug: patek-philippe
  name: Patek Philippe
  aliases: [патек, патек филипп, патек филип]
  country: switzerland
  founded: 1839
  founder: Антуан Норбер де Патек и Франсуа Чапек, позже Адриен Филипп
  city: Женева
  lat: 46.1670
  lon: 6.1220
  group: Семья Стерн
  independent: true
  tier: haute
  manufacture: full
  manufacture_note: Полный цикл в Женеве и Валле-де-Жу. Каждые часы проходят проверку по собственному стандарту Patek Philippe Seal, строже женевского клейма.
  website: https://www.patek.com
  sort: 4
  tagline: «Вы никогда не владеете Patek Philippe полностью. Вы лишь храните его для следующего поколения».
  story:
    - В 1839 году польский эмигрант Антуан Норбер де Патек основал в Женеве часовую компанию. В 1845 году к нему присоединился француз Адриен Филипп, изобретатель заводной головки вместо ключа, и в 1851 году компания стала называться Patek Philippe.
    - Мануфактура создала первые швейцарские наручные часы (1868), одни из первых наручных вечных календарей и хронографов, а в 1933 году карманные часы Henry Graves Supercomplication с 24 усложнениями.
    - С 1932 года компанией владеет семья Стерн. Сегодня это самая независимая и самая уважаемая часовая мануфактура мира. На аукционах Patek регулярно ставит рекорды.
  facts:
    - {label: "Владельцы", value: "семья Стерн с 1932 года"}
    - {label: "Производство", value: "около 70 тысяч часов в год (оценка)"}
    - {label: "Стандарт качества", value: "Patek Philippe Seal"}
    - {label: "Рекорд", value: "Grandmaster Chime, 31 млн CHF (2019)"}
  milestones:
    - {year: 1839, text: "Основание в Женеве"}
    - {year: 1845, text: "Адриен Филипп и заводная головка"}
    - {year: 1868, text: "Первые швейцарские наручные часы"}
    - {year: 1932, text: "Семья Стерн и коллекция Calatrava"}
    - {year: 1933, text: "Henry Graves Supercomplication"}
    - {year: 1976, text: "Nautilus Жеральда Женты"}
    - {year: 1996, text: "Годовой календарь, патент"}
    - {year: 2009, text: "Собственное клеймо Patek Philippe Seal"}

