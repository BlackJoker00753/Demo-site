    summary: Самые желанные спортивные часы в мире. Корпус-иллюминатор Жеральда Женты и горизонтальный рельеф циферблата.
    icon: true
    story:
      - В 1974 году Жеральд Жента, по легенде, набросал Nautilus на салфетке в ресторане за пять минут. Форма корпуса повторяет иллюминатор трансатлантического лайнера с двумя «ушами» по бокам.
      - Часы вышли в 1976 году из стали и стоили дороже многих золотых моделей. Реклама обещала, что это «одни из самых дорогих часов мира из стали».
      - В 2021 году Patek прекратил выпуск стального 5711, и очередь в бутиках превратилась в легенду. С 2023 года классический Nautilus выпускается в белом золоте как ref. 5811/1G.
    history:
      - {year: 1976, ref: "3700/1A", title: "Jumbo", text: "Первый Nautilus, 42 мм, стальной корпус из двух частей."}
      - {year: 2006, ref: "5711/1A", title: "5711", text: "40 мм и прозрачная задняя крышка. Самая известная версия модели."}
      - {year: 2021, ref: "5711/1A-014", title: "Оливковый финал", text: "Последний стальной 5711 с оливково-зелёным циферблатом."}
      - {year: 2023, ref: "5811/1G-001", title: "5811", text: "41 мм, белое золото и калибр 26-330 S C."}
    highlights: ["Дизайн Жеральда Женты", "Корпус толщиной 8,2 мм", "Белое золото", "Прозрачная задняя крышка"]
