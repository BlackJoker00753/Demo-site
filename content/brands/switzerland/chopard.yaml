  tagline: Семейный дом, который делает и высокую механику, и ювелирные часы с «танцующими» бриллиантами.
  story:
    - Луи-Юлисс Шопар открыл мастерскую в Сонвилье в 1860 году и прославился точными карманными часами. В 1963 году компанию купил немецкий ювелир Карл Шойфеле.
    - В 1976 году появились Happy Diamonds с бриллиантами, свободно плавающими между двумя стёклами, а в 1993 году спортивная Happy Sport. В 1996 году Карл-Фридрих Шойфеле основал мануфактуру L.U.C, названную по инициалам основателя.
    - Alpine Eagle 2019 года переосмыслил модель St. Moritz 1980 года. Корпус делают из собственной переплавленной стали Lucent Steel.
