  group: Swatch Group
  tier: haute
  manufacture: full
  manufacture_note: Мануфактура в долине Жу делает механизмы и вручную гравирует циферблаты гильоше на станках XIX века.
  website: https://www.breguet.com
  sort: 17
  tagline: Изобретатель турбийона, стрелок «Бреге» и первых наручных часов.
  story:
    - Абрахам-Луи Бреге, уроженец Невшателя, открыл мастерскую в Париже в 1775 году. Его клиентами были Мария-Антуанетта, Наполеон и российские императоры.
    - Бреге изобрёл турбийон (патент 1801 года), гонг для репетира, противоударную систему «парашют» и спираль с загнутым концом. Его стрелки с «яблочком» и шрифт цифр до сих пор называют его именем.
    - В 1810 году он создал для королевы Неаполя Каролины Мюрат первые известные наручные часы. Сегодня дом принадлежит Swatch Group и работает в долине Жу.
