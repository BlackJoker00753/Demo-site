  tagline: Высокое часовое искусство с 1791 года, легендарные три золотых моста и икона Laureato.
  story:
    - Мануфактура берёт начало от женевского мастера Жан-Франсуа Ботта в 1791 году, творениями которого восхищалась королева Виктория. В 1856 году Констан Жирар и Мари Перрего объединили фамилии, основав дом Girard-Perregaux.
    - В 1889 году карманный турбийон с тремя параллельными стреловидными золотыми мостами получил золотую медаль на Всемирной выставке в Париже, превратив функциональные детали механизма в высокое искусство.
    - В 1975 году марка представила спортивную модель Laureato с интегрированным браслетом и восьмиугольным безелем на круглом цоколе, опередив многие знаменитые формы эпохи.
