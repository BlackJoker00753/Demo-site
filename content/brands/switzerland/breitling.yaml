brand:
  slug: breitling
  name: Breitling
  aliases: [брайтлинг, бретлинг]
  country: switzerland
  founded: 1884
  founder: Леон Брайтлинг
  city: Гренхен
  lat: 47.1920
  lon: 7.3960
  group: Partners Group (частный фонд)
  tier: premium
  manufacture: partial
  manufacture_note: Хронографы B01 и B19 собственные. В части трёхстрелочных моделей стоят механизмы на базе ETA и Sellita.
  website: https://www.breitling.com
  sort: 15
  tagline: Инструменты для пилотов. Изобретатели отдельной кнопки хронографа.
  story:
    - Леон Брайтлинг основал мастерскую в Сент-Имье в 1884 году и специализировался на хронографах. В 1915 году его внук Гастон добавил отдельную кнопку старта хронографа, а в 1934 году Вилли Брайтлинг вторую кнопку для сброса.
    - В 1952 году появился Navitimer с круговой логарифмической линейкой, ставший официальными часами Ассоциации пилотов и владельцев самолётов (AOPA).
    - В 2009 году марка выпустила собственный хронограф B01 с колонным колесом и вертикальным сцеплением.
  facts:
    - {label: "Кнопка хронографа", value: "1915 и 1934"}
    - {label: "Navitimer", value: "1952, логарифмическая линейка"}
    - {label: "Калибр B01", value: "2009, 70 часов"}
  milestones:
