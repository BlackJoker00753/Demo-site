    icon: true
    story:
      - В 1952 году Breitling выпустила Navitimer для пилотов. Вращающийся безель с логарифмической шкалой позволял прямо в кабине вычислять среднюю скорость, расход топлива и время набора высоты.
      - Часы стали официальным инструментом AOPA, а в 1962 году Скотт Карпентер взял на орбиту версию Cosmonaute с 24-часовым циферблатом.
