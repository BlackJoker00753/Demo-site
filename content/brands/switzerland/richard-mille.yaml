    - Французский предприниматель Ришар Милль и часовой промышленник Доминик Гена основали марку в 2001 году в Ле-Брёлё.
    - "Философия марки строится на заимствовании технологий из Формулы-1 и аэрокосмической отрасли: титан Grade 5, карбон TPT, графен и скелетонизированные механизмы, способные выдерживать колоссальные ускорения до 5000 G."
    - Часы Richard Mille стали непременным атрибутом мировых звезд спорта и автогонок от Рафаэля Надаля до Фелипе Массы.
