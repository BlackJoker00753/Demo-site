brand:
  slug: swatch
  name: Swatch
  aliases: [свотч, своч]
  country: switzerland
  founded: 1983
  founder: Николас Хайек, Эрнст Томке, Эльмар Мок, Жак Мюллер
  city: Биль
  lat: 47.1368
  lon: 7.2468
  group: Swatch Group
  tier: accessible
  manufacture: full
  manufacture_note: Механизмы делает ETA из той же группы. Sistem51 собирается полностью автоматически из 51 детали.
  website: https://www.swatch.com
  sort: 22
  tagline: Пластиковые часы, которые спасли всю швейцарскую часовую индустрию.
  story:
    - К началу 1980-х кварц из Японии почти уничтожил швейцарскую отрасль. Инженеры Эльмар Мок и Жак Мюллер придумали часы из 51 детали, собираемые роботами, а Николас Хайек превратил их в модный аксессуар.
    - Swatch (Second watch, «вторые часы») 1983 года продавались миллионами. На вырученные деньги Хайек собрал Swatch Group, в которую сегодня входят Omega, Breguet, Blancpain, Longines и Tissot.
    - В 2022 году MoonSwatch, сделанные вместе с Omega, вызвали очереди у бутиков по всему миру.
  facts:
    - {label: "Деталей в первых Swatch", value: "51"}
    - {label: "Спасение отрасли", value: "1983"}
    - {label: "MoonSwatch", value: "2022, вместе с Omega"}
  milestones:
    - {year: 1983, text: "Первые Swatch"}
    - {year: 1998, text: "Появилось название Swatch Group"}
    - {year: 2013, text: "Механика Sistem51"}
    - {year: 2022, text: "MoonSwatch"}

