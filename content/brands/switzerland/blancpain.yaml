  manufacture_note: Собственные механизмы, от дайверских автоматов до карусели и минутного репетира.
  website: https://www.blancpain.com
  sort: 18
  tagline: Старейшая часовая марка мира и создатель первых современных дайверских часов.
  story:
    - Школьный учитель Жеан-Жак Бланпен начал делать часы в деревне Вильре в 1735 году. Blancpain считается самой старой часовой маркой, зарегистрированной в мире.
    - В 1953 году Fifty Fathoms по заказу французских боевых пловцов стал первыми современными дайверскими часами с односторонним безелем, светящейся массой и защитой от магнитов.
    - Марка чуть не исчезла в кварцевый кризис. В 1983 году её возродили Жан-Клод Бивер и Жак Пиге под девизом «С 1735 года никогда не было кварцевых Blancpain и никогда не будет».
  facts:
    - {label: "Основан", value: "1735, старейшая марка"}
    - {label: "Fifty Fathoms", value: "1953, первые современные дайверы"}
    - {label: "Девиз", value: "никогда не было кварца"}
  milestones:
