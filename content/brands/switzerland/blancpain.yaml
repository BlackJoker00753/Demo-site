    summary: Первые современные дайверские часы, созданные в 1953 году для боевых пловцов французского флота.
    icon: true
    story:
      - Капитан Робер Мализ и лейтенант Клод Рифо искали часы для подводных диверсантов французского флота. Никто не мог выполнить их требования, кроме Blancpain под руководством Жана-Жака Фиштера, самого увлечённого дайвера.
      - Fifty Fathoms 1953 года получил вращающийся в одну сторону безель, крупные светящиеся метки, автоподзавод и антимагнитный корпус. Эти решения стали стандартом для всех дайверских часов.
