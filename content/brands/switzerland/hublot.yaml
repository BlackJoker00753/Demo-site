  manufacture_note: Хронограф Unico собственный. В базовых моделях стоят доработанные механизмы на базе Sellita.
  website: https://www.hublot.com
  sort: 20
  tagline: "«Искусство синтеза»: золото и каучук, керамика и сапфир."
  story:
    - В 1980 году итальянец Карло Крокко выпустил золотые часы на каучуковом ремешке. Тогда это казалось кощунством, а Hublot (по-французски «иллюминатор») продавалась в основном королевским семьям.
    - В 2005 году Жан-Клод Бивер представил Big Bang, массивный хронограф из разных материалов. Марка стала символом нового люкса и в 2008 году вошла в LVMH.
    - "Hublot экспериментирует с материалами: собственное нецарапающееся золото Magic Gold, цветная керамика и корпуса из цельного сапфира."
