# Страны на глобусе. Порядок в списке = порядок в навигации (поле sort).
# altitude: насколько близко подлетает камера (меньше = ближе), в радиусах Земли.

- slug: switzerland
  name: Швейцария
  name_en: Switzerland
  iso_a3: CHE
  lat: 46.75
  lon: 7.6
  altitude: 0.19
  sort: 1
  tagline: Родина высокого часового искусства, от Женевы до долины Жу.
  intro:
    - Часовое ремесло укоренилось в Женеве в XVI веке. Законы Кальвина против роскоши 1541 года запретили носить украшения, и ювелиры переключились на часы. К XVIII веку ремесло поднялось в горы Юры, где крестьяне зимой собирали механизмы у окна.
    - В 1970-х кварцевый кризис едва не уничтожил отрасль. Спасением стали Swatch и возвращение к механике как к искусству. Сегодня Швейцария выпускает около 15 миллионов часов в год, но по стоимости это больше половины мирового рынка.
    - Надпись Swiss Made означает, что механизм швейцарский, часы собраны и проверены в Швейцарии, а не менее 60% стоимости производства приходится на эту страну.
  cities:
    - {name: Женева, lat: 46.2044, lon: 6.1432, note: "Patek Philippe, Rolex, Vacheron Constantin"}
    - {name: Долина Жу, lat: 46.6089, lon: 6.2239, note: "Jaeger-LeCoultre, Audemars Piguet, Blancpain"}
    - {name: Биль, lat: 47.1368, lon: 7.2468, note: "Omega, Swatch, механизмы Rolex"}
    - {name: Ла-Шо-де-Фон, lat: 47.1035, lon: 6.8328, note: "TAG Heuer, наследие ЮНЕСКО"}
    - {name: Ле-Локль, lat: 47.0569, lon: 6.7489, note: "Tissot, Zenith"}
    - {name: Шаффхаузен, lat: 47.6973, lon: 8.6349, note: "IWC"}
    - {name: Сент-Имье, lat: 47.1526, lon: 6.9964, note: "Longines"}
  facts:
    - {label: Экспорт часов в 2024, value: "около 26 млрд CHF"}
    - {label: Выпуск в год, value: "около 15 млн часов"}
    - {label: Наследие ЮНЕСКО, value: "Ла-Шо-де-Фон и Ле-Локль, с 2009"}
    - {label: Правило Swiss Made, value: "не менее 60% стоимости"}

- slug: germany
  name: Германия
  name_en: Germany
  iso_a3: DEU
  lat: 50.6
  lon: 10.6
  altitude: 0.42
  sort: 2
  tagline: Саксонская точность Глашютте и инженерная школа Шварцвальда.
  intro:
    - В 1845 году Фердинанд Адольф Ланге открыл мастерскую в Глашютте, обедневшем городке в Рудных горах, и обучил местных жителей ремеслу. Через полвека городок стал центром немецкого часового дела.
    - После войны мануфактуры Глашютте национализировали и объединили в GUB. После объединения Германии в 1990 году Вальтер Ланге возродил семейное имя, и в 1994 году A. Lange & Söhne показала первую коллекцию.
    - Немецкая школа узнаётся по деталям. Трёхчетвертная платина из нейзильбера, гравированные вручную мосты балансов и винтовые шатоны. На западе страны, в Шварцвальде и Пфорцхайме, живёт инженерная и инструментальная традиция.
  cities:
    - {name: Глашютте, lat: 50.8517, lon: 13.7797, note: "A. Lange & Söhne, Glashütte Original, NOMOS"}
    - {name: Пфорцхайм, lat: 48.8922, lon: 8.6947, note: "Stowa, «Золотой город»"}
    - {name: Шрамберг, lat: 48.2257, lon: 8.3842, note: "Junghans"}
    - {name: Франкфурт-на-Майне, lat: 50.1109, lon: 8.6821, note: "Sinn"}
  facts:
    - {label: Правило Глашютте, value: "не менее 50% стоимости механизма из города"}
    - {label: Фирменная деталь, value: "трёхчетвертная платина"}
    - {label: Возрождение Lange, value: "1990 (коллекция 1994)"}

- slug: japan
  name: Япония
  name_en: Japan
  iso_a3: JPN
  lat: 36.8
  lon: 138.4
  altitude: 0.5
  sort: 3
  tagline: Страна, которая изобрела кварцевые часы и заново открыла механику.
  intro:
    - 25 декабря 1969 года Seiko представила Astron, первые в мире кварцевые наручные часы. Через десять лет кварц перевернул рынок и поставил швейцарскую отрасль на грань выживания.
    - Японская школа вертикально интегрирована. Seiko и Citizen сами выращивают кристаллы кварца, делают пружины и масла. Grand Seiko вручную полирует корпуса методом Zaratsu, а Spring Drive соединяет заводную пружину с электронным регулятором.
    - Здесь же родились G-Shock, Eco-Drive и радиосинхронизация. Японские часы дают лучшее соотношение цены и качества на рынке.
  cities:
    - {name: Токио, lat: 35.6762, lon: 139.6503, note: "Seiko (Гиндза), Citizen, Casio"}
    - {name: Сиодзири, lat: 36.1150, lon: 137.9534, note: "Grand Seiko Spring Drive, студия Синсю"}
    - {name: Сидзукуиси, lat: 39.6958, lon: 140.9842, note: "механика Grand Seiko"}
    - {name: Хамура, lat: 35.7672, lon: 139.3108, note: "разработки Casio G-Shock"}
  facts:
    - {label: Первые кварцевые наручные, value: "Seiko Astron, 1969"}
    - {label: Первые часы на солнце без батарейки, value: "Citizen, 1976"}
    - {label: G-Shock, value: "1983, проект «Triple 10»"}

- slug: usa
  name: США
  name_en: United States
  iso_a3: USA
  lat: 39.5
  lon: -95.5
  altitude: 1.05
  sort: 4
  tagline: Где часы впервые начали делать на конвейере.
  intro:
    - В 1850-х Waltham в Массачусетсе первой в мире поставила часы на промышленные рельсы. Взаимозаменяемые детали сделали часы доступными миллионам.
    - Железные дороги задали стандарт точности. После крушения в Огайо в 1891 году ввели строгие требования к часам машинистов, и на этом выросла Hamilton.
    - В XX веке Bulova запустила камертонный Accutron (1960), а в XXI Apple сделала США крупнейшим по продажам производителем часов в мире.
  cities:
    - {name: Нью-Йорк, lat: 40.7128, lon: -74.006, note: "Bulova, основана в 1875"}
    - {name: Уолтем, lat: 42.3765, lon: -71.2356, note: "колыбель американских часов"}
    - {name: Ланкастер, lat: 40.0379, lon: -76.3055, note: "Hamilton, 1892"}
    - {name: Мидлбери, lat: 41.5276, lon: -73.1226, note: "Timex"}
    - {name: Детройт, lat: 42.3314, lon: -83.0458, note: "Shinola"}
    - {name: Купертино, lat: 37.323, lon: -122.0322, note: "Apple Watch"}
  facts:
    - {label: Промышленная сборка, value: "Waltham, 1850-е"}
    - {label: Камертонные часы, value: "Bulova Accutron, 1960"}
    - {label: Самые продаваемые часы в мире, value: "Apple Watch"}

- slug: france
  name: Франция
  name_en: France
  iso_a3: FRA
  lat: 46.6
  lon: 2.6
  altitude: 0.45
  sort: 5
  tagline: Париж дал миру Бреге и Картье, Безансон стал часовой столицей.
  intro:
    - В 1775 году Абрахам-Луи Бреге открыл мастерскую на набережной Орлож в Париже. Турбийон, гонг репетира, стрелки «Бреге» и первые наручные часы для королевы Неаполя родились именно здесь.
    - В 1904 году Луи Картье сделал для авиатора Альберто Сантос-Дюмона одни из первых мужских наручных часов. Французские дома моды превратили часы в объект дизайна.
    - Безансон у швейцарской границы веками был промышленной столицей французских часов. Здесь работали Lip и Yema, здесь и сегодня живёт национальная школа.
  cities:
    - {name: Париж, lat: 48.8566, lon: 2.3522, note: "Cartier, Hermès, Chanel, Louis Vuitton"}
    - {name: Безансон, lat: 47.2378, lon: 6.0241, note: "Lip, Baltic, обсерватория"}
    - {name: Морто, lat: 47.0575, lon: 6.6069, note: "Yema"}
  facts:
    - {label: Турбийон, value: "патент Бреге, 1801"}
    - {label: Santos, value: "1904, одни из первых мужских наручных"}
    - {label: Обсерватория Безансона, value: "сертификация хронометров с 1897"}

- slug: united-kingdom
  name: Великобритания
  name_en: United Kingdom
  iso_a3: GBR
  lat: 53.2
  lon: -2.2
  altitude: 0.5
  sort: 6
  tagline: Страна, где изобрели анкерный спуск и морской хронометр.
  intro:
    - Англия XVIII века была столицей точной механики. Томас Мадж изобрёл свободный анкерный спуск, который стоит почти во всех механических часах до сих пор. Джон Харрисон решил задачу долготы морским хронометром H4.
    - Промышленная эпоха ушла в Швейцарию и США, но британская школа выжила в мастерских независимых часовщиков. Сегодня её продолжают Roger W. Smith на острове Мэн и новые марки вроде Bremont и Christopher Ward.
  cities:
    - {name: Лондон, lat: 51.5072, lon: -0.1276, note: "Клеркенуэлл, исторический квартал часовщиков"}
    - {name: Гринвич, lat: 51.4769, lon: -0.0005, note: "нулевой меридиан, хронометры Харрисона"}
    - {name: Хенли-он-Темс, lat: 51.5357, lon: -0.903, note: "Bremont"}
    - {name: Мейденхед, lat: 51.5227, lon: -0.7199, note: "Christopher Ward"}
    - {name: Бристоль, lat: 51.4545, lon: -2.5879, note: "Fears"}
  facts:
    - {label: Анкерный спуск, value: "Томас Мадж, около 1755"}
    - {label: Хронометр H4, value: "Джон Харрисон, 1759"}
    - {label: Время по Гринвичу, value: "мировой стандарт с 1884"}

- slug: italy
  name: Италия
  name_en: Italy
  iso_a3: ITA
  lat: 42.9
  lon: 12.4
  altitude: 0.5
  sort: 7
  tagline: Флорентийские инструменты для флота и римская ювелирная смелость.
  intro:
    - Флорентийская мастерская Panerai с 1860-х годов делала точные приборы, а в 1936 году создала Radiomir для боевых пловцов итальянского флота. Светящаяся масса на основе радия и огромный корпус определили стиль на десятилетия.
    - Римский ювелирный дом Bulgari пришёл в часы через дизайн, а в XXI веке поставил серию мировых рекордов по тонкости с коллекцией Octo Finissimo.
    - Италия сегодня рисует и придумывает, а механизмы для её марок чаще собирают в Швейцарии.
  cities:
    - {name: Флоренция, lat: 43.7696, lon: 11.2558, note: "Panerai, мастерская на Понте-алле-Грацие"}
    - {name: Рим, lat: 41.9028, lon: 12.4964, note: "Bulgari, основан в 1884"}
    - {name: Милан, lat: 45.4642, lon: 9.19, note: "Unimatic"}
  facts:
    - {label: Radiomir, value: "1936, для итальянского флота"}
    - {label: Octo Finissimo, value: "серия мировых рекордов по тонкости"}

- slug: russia
  name: Россия
  name_en: Russia
  iso_a3: RUS
  lat: 56.8
  lon: 40.0
  altitude: 0.95
  sort: 8
  tagline: Часы, которые летали в космос и ныряли с подводниками.
  intro:
    - Старейшее предприятие страны, Петродворцовый часовой завод, ведёт историю с 1721 года, когда Пётр I основал в Петергофе гранильную фабрику. Марка «Ракета» появилась в 1961 году в честь полёта Гагарина.
    - Первый Московский часовой завод начался в 1930 году с купленного в США оборудования. Его «Штурманские» были на руке у Гагарина 12 апреля 1961 года, а хронограф 3133 летал на кораблях «Союз».
    - Завод «Восток» в Чистополе с 1967 года делает «Амфибию», часы для водолазов с оригинальной конструкцией уплотнения, которая становится надёжнее с глубиной.
  cities:
    - {name: Петергоф, lat: 59.883, lon: 29.909, note: "«Ракета», с 1721"}
    - {name: Чистополь, lat: 55.365, lon: 50.639, note: "«Восток», «Амфибия»"}
    - {name: Москва, lat: 55.7558, lon: 37.6173, note: "Первый часовой завод, «Штурманские»"}
  facts:
    - {label: Старейший завод, value: "Петродворцовый, 1721"}
    - {label: Часы Гагарина, value: "«Штурманские», 1961"}
    - {label: «Амфибия», value: "с 1967"}
