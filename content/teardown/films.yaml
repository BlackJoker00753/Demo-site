# Главы фильмов-разборок (scripts/blender/*_anim.py → scripts/teardown_film.py).
# Кадры: номер кадра рендера (0..frames-1). Тексты без длинного тире.
rolex-submariner:
  note: "Фильм отрендерен в Blender по модели, восстановленной по официальным фотографиям Rolex: размеры, печать циферблата и цифры безеля взяты с них. Механизм показан по открытым материалам Rolex о калибре 3230, раскладка колёс условная."
  chapters:
    - {from: 0, title: "Submariner 124060", text: "Корпус Oyster 41 мм из стали Oystersteel, безель Cerachrom и калибр 3230 с запасом хода 70 часов."}
    - {from: 20, title: "Винты браслета", text: "Звенья Oyster соединены винтовыми штифтами: их выкручивают отвёрткой, а не выбивают, поэтому браслет не разбалтывается."}
    - {from: 56, title: "Браслет снят", text: "Концевые звенья держатся на пружинных шпильках в ушках. Браслет снимается двумя половинами, застёжка Oysterlock остаётся на одной из них."}
    - {from: 124, title: "Задняя крышка", text: "Крышка завинчивается в корпус по резьбе и сжимает прокладку: так корпус Oyster держит давление на глубине 300 метров."}
    - {from: 170, title: "Ротор Perpetual", text: "Полукруглый ротор вращается от движений руки и через реверсивные колёса заводит пружину в любом направлении."}
    - {from: 208, title: "Мосты и баланс", text: "Сквозной мост держит баланс с двух сторон. Спираль Parachrom из сплава ниобия и циркония не боится магнитов и ударов."}
    - {from: 240, title: "Колёсная передача", text: "Барабан, колёса и спуск Chronergy: энергия пружины делится на 28 800 полуколебаний в час."}
    - {from: 260, title: "Головка Triplock", text: "Три зоны уплотнения: головка завинчивается в трубку корпуса, как крышка подводной камеры."}
    - {from: 272, title: "Лицевая сторона", text: "Безель со вставкой Cerachrom, сапфировое стекло, стрелки и лаковый циферблат с метками Chromalight."}
    - {from: 306, title: "Все детали", text: "Часы разобраны: каждая деталь на своём месте во взорванной схеме, от стекла до задней крышки."}
