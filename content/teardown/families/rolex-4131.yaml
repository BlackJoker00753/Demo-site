# Rolex 4131: хронограф Cosmograph Daytona (2023). Колонное колесо, вертикальное сцепление,
# мосты с Côtes de Genève Rolex, ротор со скелетонизацией, спуск Chronergy, спираль Parachrom.
family: rolex-4131
variants: [4131]
movement_mm: 30.5
look: >-
  Rolex manufacture automatic chronograph calibre, bridges with Rolex Côtes de Genève stripes and polished bevels,
  skeletonised 18 ct yellow gold rotor, red ruby jewels, blue Parachrom hairspring, polished steel chronograph levers.
