# Longines L791: хронограф флайбэк с колонным колесом (эксклюзив ETA для Longines), кремниевая спираль.
family: longines-l791
variants: [L791]
movement_mm: 30
look: >-
  Swiss automatic column-wheel flyback chronograph calibre, rhodium-plated bridges with Côtes de Genève,
  polished steel chronograph levers, blued column wheel, red ruby jewels, dark silicon hairspring.
plates:
  - id: movement_top
    title: Автоподзавод и мосты
    parts:
      - [rotor, "Ротор", "oscillating weight with Côtes de Genève", 28, 1]
      - [auto_bridge, "Мост автоподзавода", "automatic winding bridge", 19, 1]
      - [reverser, "Колесо-реверсор", "reversing wheel", 4.5, 2]
      - [balance_cock, "Мост баланса", "balance cock", 13, 1]
      - [bridges, "Мост барабана", "barrel bridge", 19, 1]
      - [bridges, "Мост хронографа", "chronograph bridge", 18, 1]
      - [ratchet, "Храповое колесо", "ratchet wheel", 8, 1]
  - id: movement_chrono
    title: Хронограф флайбэк
    parts:
      - [column_wheel, "Колонное колесо", "blued steel column wheel with 7 columns", 4.5, 1]
      - [clutch, "Горизонтальное сцепление", "horizontal coupling clutch lever with coupling wheel", 10, 1]
      - [chrono_wheel, "Колесо секунд хронографа", "chronograph seconds wheel with fine teeth", 9, 1]
      - [chrono_wheel, "Счётчик минут", "30-minute counter wheel", 6, 1]
      - [chrono_wheel, "Счётчик часов", "12-hour counter wheel", 6, 1]
