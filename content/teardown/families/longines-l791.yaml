      - [chrono_lever, "Рычаг сброса", "reset hammer", 11, 1]
      - [chrono_lever, "Сердечки сброса", "heart-shaped reset cams", 3, 3]
      - [chrono_lever, "Тормоз хронографа", "chronograph brake", 8, 1]
      - [chrono_lever, "Пружины рычагов", "thin steel lever springs", 7, 3]
  - id: movement_train
    title: Энергия, передача и спуск
    parts:
      - [barrel, "Барабан", "closed mainspring barrel", 10, 1]
      - [mainspring, "Заводная пружина", "mainspring out of the barrel", 12, 1]
      - [train, "Центральное колесо", "centre wheel with long pinion arbor, gold-coloured", 8, 1]
      - [train, "Промежуточное колесо", "third wheel, gold-coloured with steel pinion", 6.4, 1]
