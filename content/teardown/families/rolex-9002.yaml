# Rolex 9002: Sky-Dweller. Годовой календарь Saros, второй часовой пояс на вращающемся диске,
# управление через безель Ring Command. Спуск Chronergy, спираль Parachrom.
family: rolex-9002
variants: [9002]
movement_mm: 33
look: >-
  Rolex manufacture automatic calibre with annual calendar, rhodium-plated bridges with Côtes de Genève,
  red ruby jewels, blue Parachrom hairspring, gold-coloured wheels.
plates:
  - id: movement_top
    title: Автоподзавод и мосты
    parts:
      - [rotor, "Ротор автоподзавода", "oscillating weight with central bearing, satin finish", 31, 1]
      - [auto_bridge, "Мост автоподзавода", "automatic winding bridge", 22, 1]
      - [reverser, "Колесо-реверсор", "reversing wheel", 5, 2]
      - [balance_cock, "Мост баланса", "traversing balance bridge", 18, 1]
      - [bridges, "Мост барабана", "barrel bridge, Côtes de Genève", 23, 1]
      - [bridges, "Мост колёсной передачи", "train wheel bridge with ruby jewels", 19, 1]
      - [ratchet, "Храповое колесо", "ratchet wheel, sunburst finish", 9, 1]
      - [crown_wheel, "Коронное колесо", "crown wheel", 5, 1]
  - id: movement_train
    title: Энергия, передача и спуск
    parts:
      - [barrel, "Барабан", "closed mainspring barrel", 11, 1]
      - [mainspring, "Заводная пружина", "mainspring out of the barrel", 13, 1]
      - [train, "Центральное колесо", "centre wheel with long pinion arbor, gold-coloured", 9, 1]
      - [train, "Промежуточное колесо", "third wheel, gold-coloured with steel pinion", 7.2, 1]
      - [train, "Секундное колесо", "fourth wheel (seconds wheel) with long arbor", 6.5, 1]
      - [escape_wheel, "Анкерное колесо Chronergy", "Chronergy escape wheel", 5, 1]
      - [pallet, "Анкерная вилка Chronergy", "Chronergy pallet fork", 6, 1]
      - [balance, "Баланс со спиралью Parachrom", "balance wheel with blue Parachrom hairspring", 10, 1]
      - [shock, "Амортизатор Paraflex", "Paraflex shock absorber", 2.5, 2]
      - [winding, "Заводной триб", "winding pinion (small steel gear)", 3, 1]
      - [winding, "Кулачковая муфта", "sliding pinion / clutch wheel (steel, teeth on both ends)", 3, 1]
      - [stem, "Заводной вал", "winding stem", 15, 1]
  - id: movement_calendar
    title: Календарь Saros и второй пояс
    parts:
      - [mainplate, "Платина", "mainplate seen from the dial side, perlage", 33, 1]
      - [saros, "Колесо Saros (сателлит)", "Saros annual calendar satellite gear wheel", 6, 1]
      - [saros, "Колёса Saros", "small annual calendar wheels", 4, 3]
      - [calendar, "Кольцо месяцев", "months ring (12 small windows around dial edge), thin ring", 30, 1]
      - [date_disc, "Диск даты", "date disc printed 1 to 31", 29, 1]
      - [gmt_wheel, "Диск второго часового пояса", "24-hour reference time disc (off-centre rotating disc)", 12, 1]
      - [ring_command, "Механизм Ring Command", "Ring Command selector lever and wheels linked to the bezel", 14, 1]
      - [cannon, "Минутный триб и вексельное колесо", "cannon pinion and minute wheel", 4, 1]
      - [hour_wheel, "Часовое колесо", "hour wheel", 6, 1]
      - [setting, "Рычаги перевода", "setting lever and yoke", 9, 1]
      - [screws, "Винт моста", "polished steel screw", 2, 10]
      - [movement_ring, "Кольцо механизма", "movement holder ring", 36, 1]
