      - [hour_wheel, "Часовое колесо", "hour wheel with tube", 6, 1]
      - [setting, "Рычаг перевода стрелок", "setting lever, flat polished steel", 8, 1]
      - [setting, "Кулиса", "yoke (clutch lever), flat polished steel", 9, 1]
      - [setting, "Пружина кулисы", "yoke spring and setting lever jumper, thin steel springs", 7, 1]
      - [date_disc, "Диск даты", "date disc, thin ring printed with numbers 1 to 31, internal teeth", 26, 1, {only: [3235, 3285]}]
      - [calendar, "Колесо мгновенной даты", "instantaneous date driving wheel with finger", 7, 1, {only: [3235, 3285, 3255]}]
      - [calendar, "Фиксатор даты", "date jumper spring (flat steel spring)", 7, 1, {only: [3235, 3285, 3255]}]
