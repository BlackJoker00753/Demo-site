# Архитектура Rolex 32xx: 3230 (без даты), 3235 (дата), 3285 (GMT и дата), 3255 (день и дата).
# Диаметр механизма около 28,5 мм. Спуск Chronergy (никель-фосфор), спираль Parachrom (синяя),
# амортизаторы Paraflex, мосты с отделкой Côtes de Genève, платина с перлажем.
family: rolex-32xx
variants: [3230, 3235, 3285, 3255]
movement_mm: 28.5
look: >-
  Rolex manufacture automatic calibre, rhodium-plated nickel silver bridges with Côtes de Genève stripes
  and polished bevels, mainplate with perlage (circular graining), red synthetic ruby jewels,
  gold-coloured gear wheels, blue Parachrom hairspring, satin-finished rotor, blued steel screws are NOT used
  (Rolex uses polished steel screws).
plates:
  - id: movement_top
    title: Автоподзавод и мосты
    parts:
      - [rotor, "Ротор автоподзавода", "oscillating weight (rotor), half-moon shape, satin finish with Côtes de Genève, central ball bearing", 27, 1]
      - [auto_bridge, "Мост автоподзавода", "automatic winding bridge (reverser bridge), polished bevels", 20, 1]
      - [reverser, "Колесо-реверсор", "reversing wheel of the automatic winding (small gold wheel with pinion)", 5, 2]
      - [train, "Передаточное колесо автоподзавода", "automatic winding intermediate wheel", 6, 2]
      - [balance_cock, "Мост баланса", "traversing balance bridge fixed at two points, with regulating stud carrier, Côtes de Genève", 16, 1]
      - [bridges, "Мост барабана", "barrel bridge with jewel settings, Côtes de Genève stripes, polished bevels", 20, 1]
      - [bridges, "Мост колёсной передачи", "train wheel bridge with red ruby jewels, Côtes de Genève stripes", 18, 1]
      - [ratchet, "Храповое колесо", "ratchet wheel with sunburst (soleil) finish, large flat steel wheel", 8, 1]
      - [crown_wheel, "Коронное колесо", "crown wheel, small steel wheel with sunburst finish", 5, 1]
      - [bridges, "Мост анкерной вилки", "pallet bridge, small polished bridge with one ruby jewel", 7, 1]
  - id: movement_train
    title: Энергия, передача и спуск
    parts:
      - [barrel, "Барабан (закрытый)", "closed mainspring barrel with toothed rim, gold-coloured", 10, 1]
      - [mainspring, "Заводная пружина", "mainspring removed from barrel, relaxed spiral of thin polished steel ribbon", 12, 1]
      - [barrel, "Вал барабана", "barrel arbor (small steel shaft with hook)", 6, 1]
      - [train, "Центральное колесо", "centre wheel with long pinion arbor, gold-coloured", 10, 1]
      - [train, "Промежуточное колесо", "third wheel, gold-coloured with steel pinion", 8, 1]
      - [train, "Секундное колесо", "fourth wheel (seconds wheel) with long arbor", 7, 1]
      - [escape_wheel, "Анкерное колесо Chronergy", "Chronergy escape wheel, skeletonised, nickel-phosphorus, grey metallic", 5, 1]
      - [pallet, "Анкерная вилка Chronergy", "Chronergy pallet fork with two red ruby pallet stones", 6, 1]
      - [balance, "Баланс со спиралью Parachrom", "balance wheel with blue Parachrom hairspring with Breguet overcoil and gold Microstella nuts", 10, 1]
      - [shock, "Амортизатор Paraflex", "Paraflex shock absorber assembly (tiny spring and jewel setting)", 2.5, 2]
      - [winding, "Заводной триб", "winding pinion (small steel gear)", 3, 1]
      - [winding, "Кулачковая муфта", "sliding pinion / clutch wheel (steel, teeth on both ends)", 3, 1]
      - [stem, "Заводной вал", "winding stem (long thin steel rod with square section)", 14, 1]
  - id: movement_dial
    title: Сторона циферблата
