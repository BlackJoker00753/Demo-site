# Разборка rolex-submariner. Детали механизма: families/rolex-32xx.yaml (вариант 3230).
watch: rolex-submariner
family: rolex-32xx
variant: 3230
references: [frontend/assets/photos/rolex-submariner/1-1600.jpg, frontend/assets/photos/rolex-submariner/2-1600.jpg]
look: 'Rolex Submariner ref. 124060 (no date): 41 mm Oystersteel case with crown guards, unidirectional 60-minute black Cerachrom bezel with platinum-coated graduations, black lacquer dial with Chromalight
  markers, no date, Oyster bracelet with Glidelock clasp'
plates:
- id: exterior
  title: Корпус, безель, стекло, крышка
  parts:
  - [case, Корпус Oyster (средняя часть), '41 mm Oyster case middle with lugs, integrated crown guards, Oystersteel, polished and satin-brushed surfaces, no crown', 48, 1]
  - [bezel, Вращающийся безель, 'rotating bezel ring with knurled (serrated) edge, Oystersteel', 42, 1]
  - [bezel_insert, Вставка Cerachrom, black Cerachrom 60-minute diving bezel insert with platinum-coated graduations and triangle at 12, 40, 1]
  - [bezel_spring, Пружина-фиксатор безеля, bezel click spring (thin wavy steel wire ring), 39, 1]
  - [crystal, Сапфировое стекло, 'flat sapphire crystal, transparent with antireflective tint, seen from above', 33, 1]
  - [crown, Заводная головка Triplock, 'screw-down winding crown with fluted edge and embossed coronet on top, Oystersteel', 7, 1]
  - [crown, Трубка головки, crown tube (small threaded steel tube), 4, 1]
  - [gasket, Уплотнения головки, set of tiny black O-ring gaskets of the crown, 3, 3]
  - [caseback, Задняя крышка Oyster, 'screw-down Oyster caseback with fine fluted edge, Oystersteel, plain polished centre', 35, 1]
  - [gasket, Уплотнение крышки, 'black caseback O-ring gasket, thin ring', 33, 1]
  - [gasket, Уплотнение стекла, 'crystal gasket, thin ring', 32, 1]
  - [flange, Флажок с гравировкой, 'inner bezel ring (rehaut) with engraved text-like pattern around (no readable text), Oystersteel', 32, 1]
- id: dial
  title: Циферблат и стрелки
  parts:
  - [dial, Циферблат, 'black lacquer dial with round, rectangular and triangular luminescent hour markers in white gold surrounds, no date, printed text lines', 31, 1]
  - [hand_hour, Часовая стрелка Mercedes, 'Mercedes-style hour hand, white gold with Chromalight luminescent fill', 9, 1]
  - [hand_minute, Минутная стрелка, 'sword minute hand, white gold with luminescent fill', 14, 1]
  - [hand_second, Секундная стрелка, thin seconds hand with round lume dot and counterweight, 16, 1]
- id: bracelet
  title: Браслет Oyster
  parts:
  - [bracelet_end, Концевое звено, 'Oyster bracelet end link (solid, curved to fit the case), Oystersteel', 20, 2]
  - [bracelet_link, Звено Oyster, 'single three-piece Oyster bracelet link (flat, brushed outer, polished edges), Oystersteel', 20, 14]
  - [clasp, Застёжка Oysterlock with Glidelock, 'Oysterlock with Glidelock folding clasp with cover, opened and seen from above, Oystersteel', 38, 1]
  - [clasp, Удлинитель Easylink, Easylink 5 mm comfort extension link, 12, 1]
  - [bracelet_pins, Винт-штифт звена, tiny threaded link screw pin, 5, 8]
  - [spring_bar, Пружинный штифт, spring bar (thin steel tube with pins), 20, 2]
assembled: {front: 'the complete watch head (case, bezel, dial, hands, crown) WITHOUT bracelet or strap, seen exactly from above, centred, same lighting and background', back: 'the same watch head seen
