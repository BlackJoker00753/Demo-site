# Словарь усложнений. difficulty: 1 (просто) ... 5 (вершина ремесла).
# tab: false = не показывать отдельной вкладкой в каталоге (слишком частое или служебное).

- slug: date
  name: Дата
  name_en: Date
  category: calendar
  difficulty: 1
  tab: false
  short: Число месяца в окошке циферблата.
  description: Самое распространённое усложнение. Диск с числами от 1 до 31 поворачивается раз в сутки около полуночи.
  how_it_works: Колесо часовой стрелки делает оборот за 12 часов, поэтому через дополнительную передачу 1 к 2 палец раз в 24 часа толкает датный диск на один зуб. В месяцах короче 31 дня дату нужно подводить вручную.
  invented: Первые наручные часы с датой в окошке появились в 1930-х; Rolex Datejust 1945 года сделал её стандартом.

- slug: day-date
  name: День недели
  name_en: Day-Date
  category: calendar
  difficulty: 2
  short: День недели полностью или сокращённо рядом с датой.
  description: Добавляет к дате второй диск с днями недели. Удобно в повседневной носке и почти не утяжеляет механизм.
  how_it_works: Отдельное колесо со звёздочкой на семь лучей получает импульс раз в сутки вместе с датой. В Rolex Day-Date оба диска переключаются мгновенно ровно в полночь.
  invented: Rolex Day-Date, 1956, первые наручные часы с полным названием дня недели.

- slug: big-date
  name: Большая дата
  name_en: Big Date
  category: calendar
  difficulty: 3
  short: Дата из двух отдельных дисков, крупно и читаемо.
  description: Вместо одного тесного диска стоят два, для десятков и единиц. Цифры в несколько раз крупнее обычных.
  how_it_works: Диск единиц поворачивается каждый день, а диск десятков раз в десять дней. Сложнее всего переход с 31 на 01, когда оба диска должны сработать синхронно.
  invented: A. Lange & Söhne Lange 1, 1994, по мотивам пятиминутных часов Земпер-оперы в Дрездене.

- slug: annual-calendar
  name: Годовой календарь
  name_en: Annual Calendar
  category: calendar
  difficulty: 3
  short: Сам знает, в каком месяце 30 и 31 день. Подвод нужен раз в год.
  description: Золотая середина между простой датой и вечным календарём. Ошибается только 1 марта, потому что не учитывает февраль.
  how_it_works: Кулачок месяцев с вырезами под короткие месяцы подсказывает механизму, когда пропустить 31-е число. Февраль не распознаётся, поэтому 1 марта дату двигают вручную.
  invented: Patek Philippe, ref. 5035, 1996.

- slug: perpetual-calendar
  name: Вечный календарь
  name_en: Perpetual Calendar
  category: calendar
  difficulty: 4
  short: Учитывает длину каждого месяца и високосные годы вплоть до 2100 года.
  description: Одна из великих классических сложностей. Дата, день, месяц и цикл високосных лет работают без вмешательства владельца, если часы не останавливались.
  how_it_works: "Сердце механизма: кулачок на 48 месяцев, то есть четырёхлетний цикл. Глубина вырезов «ощупывается» рычагом и определяет, сколько дней пропустить в конце месяца. 2100 год не високосный, и тогда календарь придётся подвести."
  invented: "Томас Мадж, карманные часы, 1762. Первые серийные наручные: Patek Philippe ref. 1526, 1941."

- slug: moonphase
  name: Фаза Луны
  name_en: Moon Phase
  category: astronomy
  difficulty: 2
  short: Диск с двумя лунами показывает текущую фазу Луны.
  description: Поэтичное усложнение, которое показывает, растёт или убывает Луна. Встречается от недорогих часов до гран-сложностей.
  how_it_works: Лунный месяц длится 29,53 суток. Обычный диск на 59 зубьев с двумя лунами поворачивается на зуб в сутки и ошибается на день примерно за 2,5 года. Прецизионные передачи ошибаются на день за 122 года и больше.
  invented: Встречалась ещё в астрономических часах Средневековья; в наручных часах с 1920-х годов.

- slug: chronograph
  name: Хронограф
  name_en: Chronograph
  category: chronograph
  difficulty: 3
  short: "Встроенный секундомер: старт, стоп и сброс кнопками."
  description: Самое популярное «спортивное» усложнение. Центральная секундная стрелка отсчитывает время события, а малые счётчики накапливают минуты и часы.
  how_it_works: Отдельная цепочка колёс подключается к работающему механизму через колонное колесо или кулачок. Верхняя кнопка сцепляет и расцепляет передачу, нижняя сбрасывает стрелки на ноль сердечками сброса.
  invented: Луи Муане, 1816 (компьютер терций); Николя Рьессек, 1821.

- slug: flyback
  name: Флайбэк
  name_en: Flyback
  category: chronograph
  difficulty: 4
  short: Хронограф, который перезапускается одним нажатием без остановки.
  description: Создан для пилотов, которым нужно засекать отрезки маршрута один за другим. Нажатие кнопки сброса во время работы мгновенно обнуляет и сразу запускает отсчёт.
  how_it_works: Кнопка сброса одновременно расцепляет передачу, сбрасывает стрелки молоточками и снова сцепляет колесо хронографа. В обычном хронографе для этого нужны три нажатия.
  invented: Longines, калибр 13ZN, 1936.

- slug: split-seconds
  name: Сплит-хронограф
  name_en: Split-Seconds (Rattrapante)
  category: chronograph
  difficulty: 5
  short: Две секундные стрелки для замера двух событий одновременно.
  description: Раттрапан, от французского «догонять». Одна стрелка останавливается для промежуточного результата, другая идёт дальше, а потом первая мгновенно её догоняет.
  how_it_works: Вторая стрелка сидит на той же оси и удерживается тормозом с отдельным колонным колесом. Когда тормоз отпускают, сердечко с роликом возвращает её к основной стрелке.
  invented: Адольф Нико, патент 1862; позже Patek Philippe и Lange.

- slug: gmt
  name: GMT
  name_en: GMT / Dual Time
  category: time
  difficulty: 2
  short: Дополнительная 24-часовая стрелка для второго часового пояса.
  description: Незаменима в путешествиях. Отдельная стрелка делает оборот за сутки и показывает время дома или в другом городе по 24-часовой шкале.
  how_it_works: Стрелка GMT приводится колесом, которое вращается вдвое медленнее часовой. В «путешественнических» GMT часовая стрелка переставляется скачками по часу без остановки механизма.
  invented: Rolex GMT-Master, 1954, по запросу авиакомпании Pan Am.

- slug: world-time
  name: Мировое время
  name_en: World Time
  category: time
  difficulty: 4
  short: Время во всех 24 часовых поясах сразу.
  description: Кольцо с названиями городов и 24-часовой диск позволяют одним взглядом узнать, который час в Токио, Нью-Йорке и Париже.
  how_it_works: 24-часовой диск вращается против кольца городов. Город напротив текущего часа показывает местное время, и каждый пояс читается по своей отметке.
  invented: Луи Котье, Женева, 1931.

- slug: power-reserve
  name: Индикатор запаса хода
  name_en: Power Reserve
  category: display
  difficulty: 2
  short: Показывает, сколько энергии осталось в пружине.
  description: "Особенно полезен в часах с ручным заводом: видно, когда пора завести, чтобы часы не остановились."
  how_it_works: Дифференциальная передача сравнивает, насколько пружина заведена и насколько распущена, и переводит разницу в положение стрелки.
  invented: Абрахам-Луи Бреге, конец XVIII века.

- slug: tourbillon
  name: Турбийон
  name_en: Tourbillon
  category: regulation
  difficulty: 5
  short: Вращающаяся каретка, которая усредняет влияние гравитации.
  description: Самое зрелищное усложнение. Баланс, спираль и спуск установлены в клетку, которая обычно делает оборот за минуту.
  how_it_works: В карманных часах, стоящих вертикально, гравитация тянет спираль в одну сторону и искажает ход. Вращение клетки усредняет ошибку по всем положениям. В наручных часах это прежде всего демонстрация мастерства.
  invented: Абрахам-Луи Бреге, патент 26 июня 1801 года.

- slug: minute-repeater
  name: Минутный репетир
  name_en: Minute Repeater
  category: acoustic
  difficulty: 5
  short: "Отбивает время гонгами: часы, четверти и минуты."
  description: Одна из самых сложных и дорогих сложностей. По нажатию на задвижку часы мелодично отбивают время, что было незаменимо в темноте до электрического света.
  how_it_works: "Задвижка взводит пружину и ставит ступенчатые улитки, которые «ощупывают» положение стрелок. Два молоточка бьют по стальным гонгам: низкий тон для часов, двойной для четвертей, высокий для минут."
  invented: Томас Мадж, около 1750 года (минутный репетир в карманных часах).

- slug: alarm
  name: Будильник
  name_en: Alarm
  category: acoustic
  difficulty: 3
  short: Механический сигнал в заданное время.
  description: Отдельная пружина приводит молоточек, который бьёт по мембране или стенке корпуса. Редкое и очень практичное усложнение.
  how_it_works: Вторая пружина заводится своей головкой. Кулачок с выемкой срабатывает, когда отдельная стрелка будильника совпадает с часовой, и молоточек начинает бить.
  invented: Vulcain Cricket, 1947, самые известные механические будильники на запястье.

- slug: dive-bezel
  name: Безель дайвера
  name_en: Diving Bezel
  category: tool
  difficulty: 1
  short: Вращающийся в одну сторону безель для отсчёта времени погружения.
  description: Метку безеля совмещают с минутной стрелкой в начале погружения и видят, сколько прошло. Вращение только против часовой стрелки гарантирует, что случайный сдвиг лишь сократит расчётное время.
  how_it_works: Храповик под безелем пропускает вращение в одну сторону, обычно с шагом 60 или 120 щелчков на оборот.
  invented: Blancpain Fifty Fathoms, 1953, по заказу французских боевых пловцов.

- slug: tachymeter
  name: Тахиметр
  name_en: Tachymeter
  category: tool
  difficulty: 1
  tab: false
  short: Шкала для расчёта скорости по времени прохождения дистанции.
  description: Засекаете хронографом время на одну милю или километр, и секундная стрелка показывает скорость на шкале.
  how_it_works: Шкала рассчитана по формуле 3600 делить на число секунд. Если километр пройден за 30 секунд, стрелка укажет 120.

- slug: small-seconds
  name: Малая секунда
  name_en: Small Seconds
  category: display
  difficulty: 1
  tab: false
  short: Секундная стрелка на отдельном маленьком циферблате.
  description: Классическая компоновка карманных и классических наручных часов, где секунды сидят прямо на оси четвёртого колеса.
  how_it_works: Секундная стрелка стоит на колесе, которое делает один оборот в минуту, поэтому не нужна дополнительная передача в центр.

- slug: retrograde
  name: Ретроградная индикация
  name_en: Retrograde
  category: display
  difficulty: 3
  short: Стрелка идёт по дуге и в конце мгновенно прыгает назад.
  description: Эффектный способ показать дату, день или минуты. В конце шкалы стрелка «отстреливается» к началу.
  how_it_works: Стрелка связана с улиткой через зубчатый сектор. Когда ролик соскальзывает с высшей точки улитки, пружина возвращает сектор и стрелку в начало.

- slug: radio-sync
  name: Радиосинхронизация
  name_en: Radio-Controlled
  category: tool
  difficulty: 2
  short: Часы сами сверяются с атомными часами по радиосигналу.
  description: Каждую ночь приёмник ловит длинноволновый сигнал точного времени, и часы исправляют ошибку до долей секунды.
  how_it_works: Антенна внутри корпуса принимает сигнал станций в Японии, США, Германии, Великобритании и Китае. Микросхема сверяет время и двигает стрелки или обновляет дисплей.
  invented: Junghans Mega, 1990, первые радиоуправляемые наручные часы.

- slug: smart-sensors
  name: Датчики здоровья
  name_en: Health Sensors
  category: tool
  difficulty: 1
  short: Пульс, ЭКГ, кислород в крови, сон.
  description: Оптические и электрические датчики на задней крышке превращают часы в медицинский прибор для повседневной носки.
  how_it_works: Зелёные светодиоды и фотодиоды измеряют пульс по изменению кровотока. Электроды в задней крышке и в короне снимают одноканальную ЭКГ.
