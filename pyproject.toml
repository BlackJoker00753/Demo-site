[project]
name = "horologium"
version = "0.1.0"
description = "Horologium: интерактивный атлас часового искусства (FastAPI + SQLite + Three.js)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
horologium = "horologium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/horologium"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8.0"]
